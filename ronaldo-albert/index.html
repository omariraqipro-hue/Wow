const CR_COLOR = '#e63946', AL_COLOR = '#3a86ff';

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const easeInOut = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const easeBack = x => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const prog = (t, start, dur, fn = easeOut) => fn((t - start) / dur);
const rand = n => { const x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); };
// visibilité d'une scène avec fondu d'entrée/sortie
const vis = (t, a, b, f = 0.3) => clamp(Math.min((t - a) / f, (b - t) / f));

// Sous-titres calés sur la voix off (temps vidéo)
const CAPTIONS = [
  [0.3, 4.6, 'Sans son ami Albert, Ronaldo ne serait peut-être jamais devenu Ronaldo.'],
  [5.1, 7.9, 'Enfants, ils jouent au foot ensemble, tous les jours.'],
  [8.3, 14.4, 'Un jour, un recruteur du Sporting fait une promesse : celui qui marque le plus de buts entre au centre de formation.'],
  [14.9, 18.9, 'Albert marque. Cristiano marque. Il reste une action.'],
  [19.4, 23.1, 'Albert dribble le gardien. Il est seul face au but vide.'],
  [23.6, 25.7, 'Et il fait la passe à Cristiano.'],
  [26.2, 28.6, 'Ronaldo marque, et entre au Sporting.'],
  [29.1, 34.7, 'Après le match, il lui demande : pourquoi ? Albert répond : parce que tu es meilleur que moi.'],
  [35.2, 41.5, 'Une histoire jamais confirmée, mais qui a fait le tour du monde.'],
];

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function text(str, x, y, size, color, { align = 'center', alpha = 1, shadow = true } = {}) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.font = `bold ${size}px ${FONT}`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  if (shadow) { ctx.shadowColor = 'rgba(0,0,0,.85)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 4; }
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
  ctx.restore();
}

function wrap(str, size, maxW) {
  ctx.font = `bold ${size}px ${FONT}`;
  const lines = []; let line = '';
  for (const word of str.split(' ')) {
    const test = line ? line + ' ' + word : word;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = word; } else line = test;
  }
  lines.push(line);
  return lines;
}

function pill(str, x, y, size, bg, fg, padX = 40) {
  ctx.save();
  ctx.font = `bold ${size}px ${FONT}`;
  const w = ctx.measureText(str).width + padX * 2, h = size * 1.7;
  ctx.fillStyle = bg; roundRect(x - w / 2, y - h / 2, w, h, h / 2); ctx.fill();
  ctx.restore();
  text(str, x, y + 2, size, fg, { shadow: false });
}

// bulle de dialogue
function bubble(str, x, y, size, maxW, tailX, alpha) {
  if (alpha <= 0) return;
  const lines = wrap(str, size, maxW);
  const lh = size * 1.25, w = Math.min(maxW, Math.max(...lines.map(l => ctx.measureText(l).width))) + 60, h = lines.length * lh + 44;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y); ctx.scale(lerp(0.6, 1, alpha), lerp(0.6, 1, alpha));
  ctx.fillStyle = WHITE;
  roundRect(-w / 2, -h, w, h, 28); ctx.fill();
  ctx.beginPath(); ctx.moveTo(tailX - 20, -2); ctx.lineTo(tailX + 20, -2); ctx.lineTo(tailX, 34); ctx.fill();
  lines.forEach((l, i) => text(l, 0, -h + 22 + lh / 2 + i * lh, size, '#111', { shadow: false }));
  ctx.restore();
}

// ---- Personnages stylisés (pas de ressemblance réelle) ----
function drawKid(x, y, s, shirt, label, { run = 0, t = 0, kick = 0, face = 1, number = '' } = {}) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(s * face, s);
  const swing = run ? Math.sin(t * 14) * 0.6 : 0;
  ctx.lineCap = 'round';
  // jambes
  ctx.strokeStyle = '#2b1d14'; ctx.lineWidth = 16;
  ctx.save(); ctx.translate(0, -70); ctx.rotate(swing + kick * -1.1);
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 70); ctx.stroke(); ctx.restore();
  ctx.save(); ctx.translate(0, -70); ctx.rotate(-swing);
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 70); ctx.stroke(); ctx.restore();
  // short
  ctx.fillStyle = '#f1f1f1'; roundRect(-24, -86, 48, 30, 8); ctx.fill();
  // bras
  ctx.strokeStyle = '#8d5a3b'; ctx.lineWidth = 12;
  ctx.save(); ctx.translate(0, -150); ctx.rotate(-swing * 0.8 + 0.2);
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 55); ctx.stroke(); ctx.restore();
  // maillot
  ctx.fillStyle = shirt; roundRect(-30, -160, 60, 80, 16); ctx.fill();
  if (number) { ctx.save(); ctx.scale(face, 1); text(number, 0, -118, 34, WHITE, { shadow: false }); ctx.restore(); }
  ctx.save(); ctx.translate(0, -150); ctx.rotate(swing * 0.8 - 0.2);
  ctx.strokeStyle = '#8d5a3b'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 55); ctx.stroke(); ctx.restore();
  // tête (silhouette simple)
  ctx.fillStyle = '#8d5a3b'; ctx.beginPath(); ctx.arc(0, -192, 30, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1b120c'; ctx.beginPath(); ctx.arc(0, -200, 30, Math.PI, 0); ctx.fill();
  ctx.restore();
  if (label) {
    ctx.save(); ctx.translate(x, y - 250 * s);
    pill(label, 0, 0, 30 * Math.max(1, s * 0.9), 'rgba(0,0,0,.6)', WHITE, 18);
    ctx.restore();
  }
}

function drawBall(x, y, r = 16, rot = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = WHITE; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(0, 0, r * 0.35, 0, Math.PI * 2); ctx.fill();
  for (let i = 0; i < 5; i++) { const a = i * Math.PI * 2 / 5; ctx.beginPath(); ctx.arc(Math.cos(a) * r * 0.8, Math.sin(a) * r * 0.8, r * 0.2, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();
}

// ---- Décor : terrain en vue de côté ----
const P = { x: 70, y: 190, w: 940, h: 960 };
const GROUND = P.y + 760;

function drawPitch(t, { goal = false, night = false } = {}) {
  const { x, y, w, h } = P;
  const sky = ctx.createLinearGradient(0, y, 0, GROUND);
  sky.addColorStop(0, night ? '#0b1a3a' : '#5fb4ff'); sky.addColorStop(1, night ? '#24406e' : '#bfe3ff');
  ctx.fillStyle = sky; ctx.fillRect(x, y, w, GROUND - y);
  // tribune lointaine
  ctx.fillStyle = night ? '#16233d' : '#7c8da3'; ctx.fillRect(x, GROUND - 170, w, 90);
  for (let i = 0; i < 70; i++) {
    ctx.fillStyle = ['#e63946', '#ffffff', '#1fa463', '#ffd23f'][i % 4];
    ctx.globalAlpha = 0.5; ctx.fillRect(x + rand(i) * w, GROUND - 160 + rand(i + 5) * 70, 8, 8); ctx.globalAlpha = 1;
  }
  // pelouse rayée
  for (let i = 0; i < 8; i++) {
    ctx.fillStyle = i % 2 ? '#2e9e4f' : '#35b25a';
    ctx.fillRect(x + i * w / 8, GROUND - 80, w / 8 + 1, y + h - GROUND + 80);
  }
  ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(x, GROUND + 30); ctx.lineTo(x + w, GROUND + 30); ctx.stroke();
  if (goal) drawGoal(t);
}

const GOAL_X = P.x + 800;
let netBulge = 0;
function drawGoal() {
  const gx = GOAL_X, top = GROUND - 230;
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2;
  for (let i = 0; i <= 8; i++) { ctx.beginPath(); ctx.moveTo(gx + i * 14 + netBulge * Math.sin(i / 8 * Math.PI) * 30, top); ctx.lineTo(gx + i * 14 + netBulge * 30 * Math.sin(i / 8 * Math.PI), GROUND + 30); ctx.stroke(); }
  for (let j = 0; j <= 10; j++) { const yy = top + j * 26; ctx.beginPath(); ctx.moveTo(gx, yy); ctx.lineTo(gx + 112 + netBulge * 30 * Math.sin(j / 10 * Math.PI), yy); ctx.stroke(); }
  ctx.strokeStyle = WHITE; ctx.lineWidth = 12;
  ctx.beginPath(); ctx.moveTo(gx, GROUND + 30); ctx.lineTo(gx, top); ctx.lineTo(gx + 112, top); ctx.stroke();
}

function drawPanelFrame() {
  ctx.strokeStyle = 'rgba(255,255,255,.2)'; ctx.lineWidth = 4;
  roundRect(P.x, P.y, P.w, P.h, 30); ctx.stroke();
}

// ---- Scènes ----
function sceneHook(t) {
  const v = vis(t, 0, 5.0); if (v <= 0) return;
  ctx.save(); ctx.globalAlpha = v;
  drawPitch(t, { night: true });
  ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(P.x, P.y, P.w, P.h);
  const zoom = 1 + t * 0.03;
  ctx.save(); ctx.translate(540, GROUND); ctx.scale(zoom, zoom); ctx.translate(-540, -GROUND);
  drawKid(400, GROUND + 40, 1.5, AL_COLOR, 'ALBERT', { number: '' });
  drawKid(680, GROUND + 40, 1.5, CR_COLOR, 'CRISTIANO', { number: '7', face: -1 });
  ctx.restore();
  const p1 = prog(t, 0.2, 0.4, easeBack);
  ctx.save(); ctx.translate(540, P.y + 150); ctx.scale(p1, p1);
  text('SANS SON AMI', 0, 0, 64, WHITE);
  text('ALBERT…', 0, 90, 110, YELLOW);
  ctx.restore();
  const p2 = prog(t, 2.2, 0.4, easeBack);
  ctx.save(); ctx.translate(540, P.y + 380); ctx.scale(p2, p2);
  pill('pas de Ronaldo ?', 0, 0, 60, CR_COLOR, WHITE, 40);
  ctx.restore();
  ctx.restore();
}

function sceneStreet(t) {
  const v = vis(t, 4.8, 8.4); if (v <= 0) return;
  ctx.save(); ctx.globalAlpha = v;
  drawPitch(t);
  const k = (t - 4.8) * 1.6; // allers-retours du ballon
  const ph = k - Math.floor(k), dir = Math.floor(k) % 2;
  const ax = 330, cx = 750;
  const bx = dir ? lerp(cx - 40, ax + 40, ph) : lerp(ax + 40, cx - 40, ph);
  const by = GROUND + 20 - Math.sin(ph * Math.PI) * 120;
  drawKid(ax, GROUND + 40, 1.5, AL_COLOR, 'ALBERT', { kick: dir ? 0 : Math.max(0, 1 - ph * 5), t });
  drawKid(cx, GROUND + 40, 1.5, CR_COLOR, 'CRISTIANO', { face: -1, number: '7', kick: dir ? Math.max(0, 1 - ph * 5) : 0, t });
  drawBall(bx, by, 18, t * 8);
  text('Tous les jours.', 540, P.y + 120, 64, WHITE, { alpha: prog(t, 6.6, 0.4) });
  ctx.restore();
}

function sceneScout(t) {
  const v = vis(t, 8.1, 14.8); if (v <= 0) return;
  ctx.save(); ctx.globalAlpha = v;
  drawPitch(t);
  // recruteur : adulte avec casquette et carnet
  const sx = 790, sy = GROUND + 40;
  ctx.save(); ctx.translate(sx, sy); ctx.scale(1.6, 1.6);
  ctx.strokeStyle = '#222'; ctx.lineWidth = 14; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-10, -80); ctx.lineTo(-12, 0); ctx.moveTo(10, -80); ctx.lineTo(12, 0); ctx.stroke();
  ctx.fillStyle = GREEN; roundRect(-32, -175, 64, 100, 16); ctx.fill();
  ctx.fillStyle = WHITE; ctx.fillRect(-32, -150, 64, 12); ctx.fillRect(-32, -120, 64, 12);
  ctx.fillStyle = '#c99a6e'; ctx.beginPath(); ctx.arc(0, -205, 28, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(0, -212, 29, Math.PI, 0); ctx.fill(); ctx.fillRect(-45, -214, 50, 8);
  ctx.fillStyle = '#f5f5f5'; ctx.fillRect(-60, -140, 30, 40);
  ctx.restore();
  ctx.save(); ctx.translate(sx, sy - 400); pill('RECRUTEUR DU SPORTING', 0, 0, 28, GREEN, WHITE, 20); ctx.restore();
  drawKid(250, GROUND + 40, 1.4, AL_COLOR, 'ALBERT', {});
  drawKid(460, GROUND + 40, 1.4, CR_COLOR, 'CRISTIANO', { number: '7' });
  const b = prog(t, 10.9, 0.35, easeBack);
  bubble('Celui qui marque le plus de buts entre au centre de formation !', 500, P.y + 250, 46, 720, 200, b);
  ctx.restore();
}

function sceneScore(t) {
  const v = vis(t, 14.6, 19.2); if (v <= 0) return;
  ctx.save(); ctx.globalAlpha = v;
  drawPitch(t, { night: true });
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(P.x, P.y, P.w, P.h);
  // tableau d'affichage
  ctx.fillStyle = '#0d0d0d'; roundRect(140, P.y + 160, 800, 420, 30); ctx.fill();
  ctx.strokeStyle = YELLOW; ctx.lineWidth = 6; roundRect(140, P.y + 160, 800, 420, 30); ctx.stroke();
  text('BUTS', 540, P.y + 220, 44, GREY);
  const rows = [['ALBERT', AL_COLOR, 15.0], ['CRISTIANO', CR_COLOR, 16.35]];
  rows.forEach(([name, col, at], i) => {
    const yy = P.y + 320 + i * 130;
    text(name, 200, yy, 64, col, { align: 'left' });
    const n = t >= at ? 1 : 0;
    const pop = t >= at ? 1 + 0.6 * (1 - easeOut((t - at) / 0.3)) : 1;
    ctx.save(); ctx.translate(860, yy); ctx.scale(pop, pop); text(String(n), 0, 0, 90, WHITE); ctx.restore();
  });
  const p = prog(t, 18.0, 0.35, easeBack);
  ctx.save(); ctx.translate(540, P.y + 720); ctx.scale(p, p);
  pill('DERNIÈRE ACTION', 0, 0, 64, YELLOW, '#111', 40);
  ctx.restore();
  ctx.restore();
}

// action finale : dribble, passe, but (19–29 s)
function sceneAction(t) {
  const v = vis(t, 19.0, 29.0); if (v <= 0) return;
  ctx.save(); ctx.globalAlpha = v;
  // filet qui se gonfle au but
  netBulge = t > 26.5 ? Math.max(0, 1 - (t - 26.5) / 0.8) : 0;
  drawPitch(t, { goal: true });
  const g = GROUND + 40;
  // gardien
  const dive = prog(t, 20.3, 0.5);
  ctx.save(); ctx.translate(lerp(GOAL_X - 10, GOAL_X - 110, dive), g - dive * 40); ctx.rotate(-dive * 1.4);
  drawKid(0, 0, 1.35, '#ff9f1c', '', {});
  ctx.restore();
  if (t < 22) { ctx.save(); ctx.globalAlpha *= 1 - prog(t, 21, 0.5); ctx.translate(GOAL_X - 10, g - 300); pill('GARDIEN', 0, 0, 26, 'rgba(0,0,0,.6)', WHITE, 14); ctx.restore(); }
  // Albert : course avec le ballon puis dépasse le gardien
  const ax = t < 20.8 ? lerp(220, 600, easeInOut((t - 19.0) / 1.8)) : lerp(600, 700, easeOut((t - 20.8) / 0.7));
  const aRun = t < 21.5;
  // Cristiano arrive par la gauche
  const cx = lerp(60, 330, easeOut((t - 19.0) / 4.0));
  const cRun = t < 23.0 || (t > 25.6 && t < 26.0);
  const kickA = t > 23.6 && t < 24.0 ? 1 - (t - 23.6) / 0.4 : 0;
  const kickC = t > 25.9 && t < 26.3 ? 1 - (t - 25.9) / 0.4 : 0;
  drawKid(cx, g, 1.35, CR_COLOR, 'CRISTIANO', { run: cRun, t, number: '7', kick: kickC });
  drawKid(ax, g, 1.35, AL_COLOR, 'ALBERT', { run: aRun, t, kick: kickA, face: t > 23.2 ? -1 : 1 });
  // ballon
  let bx, by = g - 16;
  if (t < 23.6) bx = ax + 34;
  else if (t < 24.4) bx = lerp(ax - 34, cx + 34, easeOut((t - 23.6) / 0.8));
  else if (t < 26.0) bx = cx + 34;
  else { const k = easeOut((t - 26.0) / 0.5); bx = lerp(cx + 34, GOAL_X + 60, k); by = lerp(g - 16, GROUND - 120, k); }
  drawBall(bx, by, 16, bx / 15);
  // textes
  if (t > 21.2 && t < 23.6) {
    const p = prog(t, 21.2, 0.3, easeBack);
    ctx.save(); ctx.translate(540, P.y + 160); ctx.scale(p, p);
    text('SEUL FACE', 0, 0, 80, WHITE); text('AU BUT VIDE…', 0, 95, 80, YELLOW);
    ctx.restore();
  }
  if (t > 23.6 && t < 26.0) {
    const p = prog(t, 23.6, 0.3, easeBack);
    ctx.save(); ctx.translate(540, P.y + 200); ctx.scale(p, p);
    text('…ET IL FAIT', 0, 0, 72, WHITE); text('LA PASSE', 0, 100, 120, YELLOW);
    ctx.restore();
  }
  if (t > 26.5) {
    const p = prog(t, 26.5, 0.35, easeBack);
    ctx.save(); ctx.translate(540, P.y + 170); ctx.scale(p, p); ctx.rotate(-0.05);
    text('BUT !', 0, 0, 170, YELLOW);
    ctx.restore();
    const p2 = prog(t, 27.1, 0.35, easeBack);
    ctx.save(); ctx.translate(540, P.y + 340); ctx.scale(p2, p2);
    pill('Il entre au Sporting', 0, 0, 56, GREEN, WHITE, 40);
    ctx.restore();
    // confettis
    for (let i = 0; i < 60; i++) {
      const life = t - 26.5, cxp = P.x + rand(i) * P.w, cyp = P.y + (rand(i + 3) * 200 + life * (250 + rand(i + 9) * 250)) % P.h;
      ctx.fillStyle = [GREEN, WHITE, YELLOW][i % 3]; ctx.fillRect(cxp + Math.sin(life * 4 + i) * 20, cyp, 12, 18);
    }
  }
  // flash au but
  const f = Math.max(0, 1 - Math.abs(t - 26.5) / 0.15);
  if (f > 0) { ctx.fillStyle = `rgba(255,255,255,${0.6 * f})`; ctx.fillRect(P.x, P.y, P.w, P.h); }
  ctx.restore();
}

function sceneWhy(t) {
  const v = vis(t, 28.8, 35.2); if (v <= 0) return;
  ctx.save(); ctx.globalAlpha = v;
  drawPitch(t, { night: true });
  ctx.fillStyle = 'rgba(10,20,40,.35)'; ctx.fillRect(P.x, P.y, P.w, P.h);
  drawKid(330, GROUND + 40, 1.6, CR_COLOR, 'CRISTIANO', { number: '7' });
  drawKid(750, GROUND + 40, 1.6, AL_COLOR, 'ALBERT', { face: -1 });
  bubble('Pourquoi ?', 330, P.y + 290, 60, 400, 0, prog(t, 29.9, 0.3, easeBack) * (1 - prog(t, 32.0, 0.25)));
  bubble('Parce que tu es meilleur que moi.', 690, P.y + 300, 54, 520, 60, prog(t, 32.2, 0.35, easeBack));
  ctx.restore();
}

function sceneOutro(t) {
  const v = vis(t, 35.0, 99); if (v <= 0) return;
  ctx.save(); ctx.globalAlpha = v;
  const bg = ctx.createLinearGradient(0, P.y, 0, P.y + P.h);
  bg.addColorStop(0, '#0e2a1b'); bg.addColorStop(1, '#05140c');
  ctx.fillStyle = bg; roundRect(P.x, P.y, P.w, P.h, 30); ctx.fill();
  // globe stylisé qui tourne
  const gx = 540, gy = P.y + 300, r = 150;
  ctx.fillStyle = '#1e6091'; ctx.beginPath(); ctx.arc(gx, gy, r, 0, Math.PI * 2); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(gx, gy, r, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = '#52b788';
  for (let i = 0; i < 5; i++) {
    const lx = gx - r + ((i * 130 + (t - 35) * 80) % (2 * r + 120)) - 60;
    ctx.beginPath(); ctx.ellipse(lx, gy - 60 + rand(i) * 120, 50 + rand(i + 1) * 30, 30 + rand(i + 2) * 30, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  text('Histoire jamais confirmée…', 540, P.y + 540, 54, GREY, { alpha: prog(t, 35.3, 0.4) });
  text('…mais elle a fait le tour du monde.', 540, P.y + 615, 50, WHITE, { alpha: prog(t, 36.6, 0.4) });
  const p = prog(t, 38.3, 0.4, easeBack);
  ctx.save(); ctx.translate(540, P.y + 790); ctx.scale(p, p);
  pill('Et toi, t’aurais fait la passe ?', 0, 0, 52, YELLOW, '#111', 40);
  ctx.restore();
  text('Réponds en commentaire', 540, P.y + 900, 40, WHITE, { alpha: prog(t, 39.3, 0.4) });
  ctx.restore();
}

function drawCaption(t) {
  const c = CAPTIONS.find(([a, b]) => t >= a && t < b);
  if (!c) return;
  const [a, b, str] = c;
  const alpha = vis(t, a, b, 0.15);
  const lines = wrap(str, 50, 900);
  const lh = 64, top = 1250;
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.fillStyle = 'rgba(0,0,0,.55)';
  roundRect(60, top - 30, 960, lines.length * lh + 50, 26); ctx.fill();
  lines.forEach((l, i) => text(l, 540, top + 8 + lh / 2 + i * lh - 10, 50, WHITE, { shadow: false }));
  ctx.restore();
}

function drawProgress(t) {
  ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(0, 0, W, 10);
  ctx.fillStyle = YELLOW; ctx.fillRect(0, 0, W * clamp(t / DURATION), 10);
}

function render(t) {
  t = clamp(t, 0, DURATION);
  ctx.fillStyle = '#04110a'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  roundRect(P.x, P.y, P.w, P.h, 30); ctx.clip();
  ctx.fillStyle = '#071a10'; ctx.fillRect(P.x, P.y, P.w, P.h);
  sceneHook(t); sceneStreet(t); sceneScout(t); sceneScore(t); sceneAction(t); sceneWhy(t); sceneOutro(t);
  ctx.restore();
  drawPanelFrame();
  drawCaption(t);
  drawProgress(t);
}
window.renderAt = render;

const playBtn = document.getElementById('play');
const sfx = document.getElementById('sfx');
playBtn.addEventListener('click', () => {
  playBtn.hidden = true;
  sfx.currentTime = 0;
  const start = performance.now();
  sfx.play().catch(() => {});
  const loop = now => {
    const t = !sfx.paused && sfx.currentTime > 0 ? sfx.currentTime : (now - start) / 1000;
    render(t);
    if (t < DURATION) requestAnimationFrame(loop);
    else { playBtn.textContent = '↻ Rejouer'; playBtn.hidden = false; }
  };
  requestAnimationFrame(loop);
});

render(2.8);
</script>
</body>
</html>

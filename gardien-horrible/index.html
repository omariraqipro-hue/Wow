<script>
const W = 1080, H = 1920, DURATION = 33;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const FONT = 'Arial, "Liberation Sans", Helvetica, sans-serif';
const YELLOW = '#ffd23f', WHITE = '#ffffff', GREY = '#a9b4ad', RED = '#ff3b3b';
const KEEPER = '#ff9f1c', TEAM = '#3a86ff', RIVAL = '#e63946';

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const easeInOut = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const easeBack = x => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const prog = (t, start, dur, fn = easeOut) => fn((t - start) / dur);
const rand = n => { const x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); };
const vis = (t, a, b, f = 0.25) => clamp(Math.min((t - a) / f, (b - t) / f));

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function text(str, x, y, size, color, { align = 'center', alpha = 1, shadow = true } = {}) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.font = `bold ${size}px ${FONT}`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  if (shadow) { ctx.shadowColor = 'rgba(0,0,0,.85)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 4; }
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
  ctx.restore();
}

function pill(str, x, y, size, bg, fg, padX = 40) {
  ctx.save();
  ctx.font = `bold ${size}px ${FONT}`;
  const w = ctx.measureText(str).width + padX * 2, h = size * 1.7;
  ctx.fillStyle = bg; roundRect(x - w / 2, y - h / 2, w, h, h / 2); ctx.fill();
  ctx.restore();
  text(str, x, y + 2, size, fg, { shadow: false });
}

function bubble(str, x, y, size, alpha, tailX = 0) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.font = `bold ${size}px ${FONT}`;
  const w = ctx.measureText(str).width + 50, h = size * 1.8;
  ctx.globalAlpha = clamp(alpha);
  ctx.translate(x, y); ctx.scale(lerp(0.6, 1, clamp(alpha)), lerp(0.6, 1, clamp(alpha)));
  ctx.fillStyle = WHITE; roundRect(-w / 2, -h, w, h, 24); ctx.fill();
  ctx.beginPath(); ctx.moveTo(tailX - 16, -2); ctx.lineTo(tailX + 16, -2); ctx.lineTo(tailX, 28); ctx.fill();
  ctx.restore();
  ctx.save(); ctx.globalAlpha = clamp(alpha);
  text(str, x, y - h / 2, size, '#111', { shadow: false });
  ctx.restore();
}

// ---- Stickman ----
// pieds à y=0, tourné vers +x (face=-1 pour retourner)
// mood : 'smile' | 'sad' | 'shock' ; arms : 0 normal, 1 bras levés ; point : bras avant tendu
function drawStick(x, y, s, color, { run = 0, t = 0, kick = 0, face = 1, arms = 0, point = 0, gloves = false, mood = 'smile', rot = 0, label = '' } = {}) {
  const ph = t * 13;
  const bob = run ? Math.abs(Math.sin(ph)) * 8 : 0;
  const HIP = [0, -96], NECK = [0, -168], SH = [0, -158], L = 50;
  const seg = (p, a, len) => [p[0] + Math.sin(a) * len, p[1] + Math.cos(a) * len];
  const legs = [0, 1].map(side => {
    let thigh = run ? Math.sin(ph + side * Math.PI) * 0.75 : (side ? -0.14 : 0.14);
    let shin = thigh - (run ? Math.max(0, -Math.cos(ph + side * Math.PI)) * 1.3 : 0);
    if (side === 0 && kick > 0) { thigh = lerp(thigh, 1.25, kick); shin = lerp(shin, 1.0, kick); }
    const knee = seg(HIP, thigh, L);
    return [HIP, knee, seg(knee, shin, L)];
  });
  const hands = [];
  const armSegs = [0, 1].map(side => {
    let upper = run ? -Math.sin(ph + side * Math.PI) * 0.9 : (side ? -0.3 : 0.3);
    let fore = upper + (run ? 1.1 : 0.15);
    if (arms > 0) { upper = lerp(upper, side ? -2.5 : 2.5, arms); fore = lerp(fore, side ? -2.8 : 2.8, arms); }
    if (side === 0 && point > 0) { upper = lerp(upper, 1.6, point); fore = lerp(fore, 1.6, point); }
    const elbow = seg(SH, upper, 40), hand = seg(elbow, fore, 38);
    hands.push(hand);
    return [SH, elbow, hand];
  });
  const strokeAll = (w, c) => {
    ctx.strokeStyle = c; ctx.lineWidth = w;
    for (const [a, b, c2] of [...legs, ...armSegs]) { ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.lineTo(...c2); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(...HIP); ctx.lineTo(...NECK); ctx.stroke();
  };
  ctx.save();
  ctx.translate(x, y - bob * s);
  ctx.rotate(rot);
  ctx.scale(s * face, s);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  strokeAll(20, '#0b0b0b');
  strokeAll(11, color);
  if (gloves) for (const [hx, hy] of hands) {
    ctx.fillStyle = '#0b0b0b'; ctx.beginPath(); ctx.arc(hx, hy, 17, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = WHITE; ctx.beginPath(); ctx.arc(hx, hy, 12, 0, Math.PI * 2); ctx.fill();
  }
  const hx = 4, hy = -196;
  ctx.fillStyle = '#0b0b0b'; ctx.beginPath(); ctx.arc(hx, hy, 30, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(hx, hy, 25, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#0b0b0b'; ctx.strokeStyle = '#0b0b0b'; ctx.lineWidth = 4;
  const er = mood === 'shock' ? 6 : 4.5;
  for (const ex of [hx - 1, hx + 14]) { ctx.beginPath(); ctx.arc(ex, hy - 5, er, 0, Math.PI * 2); ctx.fill(); }
  ctx.beginPath();
  if (mood === 'smile') ctx.arc(hx + 6, hy + 2, 10, 0.35, 2.6);
  else if (mood === 'sad') ctx.arc(hx + 6, hy + 16, 9, 3.6, 5.8);
  else { ctx.ellipse(hx + 6, hy + 10, 5, 7, 0, 0, Math.PI * 2); }
  ctx.stroke();
  if (mood === 'sad') { // larme
    ctx.fillStyle = '#7fd1ff'; ctx.beginPath(); ctx.arc(hx + 16, hy + 6 + ((t * 40) % 14), 4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  if (label) { ctx.save(); ctx.translate(x, y - 265 * s); pill(label, 0, 0, 30, 'rgba(0,0,0,.65)', WHITE, 18); ctx.restore(); }
}

function drawBall(x, y, r = 16, rot = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = '#0b0b0b'; ctx.beginPath(); ctx.arc(0, 0, r + 3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = WHITE; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(0, 0, r * 0.35, 0, Math.PI * 2); ctx.fill();
  for (let i = 0; i < 5; i++) { const a = i * Math.PI * 2 / 5; ctx.beginPath(); ctx.arc(Math.cos(a) * r * 0.8, Math.sin(a) * r * 0.8, r * 0.2, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();
}

// ---- Décor ----
const P = { x: 70, y: 190, w: 940, h: 960 };
const GROUND = P.y + 780;
const G = GROUND + 40;          // ligne des pieds
const GOAL_X = P.x + 790;
let netBulge = 0;

function drawPitch({ night = false, crowdDim = 0, snow = false, t = 0 } = {}) {
  const { x, y, w, h } = P;
  const sky = ctx.createLinearGradient(0, y, 0, GROUND);
  sky.addColorStop(0, night ? '#0b1a3a' : '#5fb4ff'); sky.addColorStop(1, night ? '#2b4a7a' : '#bfe3ff');
  ctx.fillStyle = sky; ctx.fillRect(x, y, w, GROUND - y);
  ctx.fillStyle = night ? '#16233d' : '#7c8da3'; ctx.fillRect(x, GROUND - 170, w, 90);
  for (let i = 0; i < 80; i++) {
    ctx.fillStyle = ['#e63946', '#ffffff', '#3a86ff', '#ffd23f'][i % 4];
    ctx.globalAlpha = 0.55 * (1 - crowdDim); ctx.fillRect(x + rand(i) * w, GROUND - 160 + rand(i + 5) * 70, 8, 8); ctx.globalAlpha = 1;
  }
  for (let i = 0; i < 8; i++) {
    ctx.fillStyle = i % 2 ? '#2e9e4f' : '#35b25a';
    ctx.fillRect(x + i * w / 8, GROUND - 80, w / 8 + 1, y + h - GROUND + 80);
  }
  ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(x, GROUND + 30); ctx.lineTo(x + w, GROUND + 30); ctx.stroke();
  if (snow) {
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    for (let i = 0; i < 90; i++) {
      const sx = x + ((rand(i) * w + Math.sin(t * 2 + i) * 20 - t * 30) % w + w) % w;
      const sy = y + ((rand(i + 50) * h + t * (60 + rand(i + 7) * 60)) % h);
      ctx.beginPath(); ctx.arc(sx, sy, 3 + rand(i + 3) * 3, 0, Math.PI * 2); ctx.fill();
    }
  }
}

function drawGoal() {
  const gx = GOAL_X, top = GROUND - 240, d = 120;
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2;
  for (let i = 0; i <= 8; i++) { const b = netBulge * 30 * Math.sin(i / 8 * Math.PI); ctx.beginPath(); ctx.moveTo(gx + i * d / 8 + b, top); ctx.lineTo(gx + i * d / 8 + b, GROUND + 30); ctx.stroke(); }
  for (let j = 0; j <= 10; j++) { const yy = top + j * 27; ctx.beginPath(); ctx.moveTo(gx, yy); ctx.lineTo(gx + d + netBulge * 30 * Math.sin(j / 10 * Math.PI), yy); ctx.stroke(); }
  ctx.strokeStyle = '#0b0b0b'; ctx.lineWidth = 18;
  ctx.beginPath(); ctx.moveTo(gx, GROUND + 30); ctx.lineTo(gx, top); ctx.lineTo(gx + d, top); ctx.stroke();
  ctx.strokeStyle = WHITE; ctx.lineWidth = 11;
  ctx.beginPath(); ctx.moveTo(gx, GROUND + 30); ctx.lineTo(gx, top); ctx.lineTo(gx + d, top); ctx.stroke();
}

// taille de police réduite si le texte dépasse maxW
function fitSize(str, size, maxW) {
  ctx.font = `bold ${size}px ${FONT}`;
  return Math.min(size, Math.floor(size * maxW / ctx.measureText(str).width));
}

// gros titre sous le décor : ligne 1 puis ligne 2 (punchline)
function caption(t, a, b, l1, l2, t2, color2 = YELLOW) {
  const v = vis(t, a, b, 0.2); if (v <= 0) return;
  ctx.save(); ctx.globalAlpha = v;
  const p1 = prog(t, a, 0.3, easeBack);
  ctx.save(); ctx.translate(540, 1290); ctx.scale(p1, p1); text(l1, 0, 0, fitSize(l1, 62, 900), WHITE); ctx.restore();
  if (l2 && t >= t2) {
    const p2 = prog(t, t2, 0.3, easeBack);
    ctx.save(); ctx.translate(540, 1390); ctx.scale(p2, p2); text(l2, 0, 0, fitSize(l2, 72, 900), color2); ctx.restore();
  }
  ctx.restore();
}

// ---- Scènes ----
function sceneHook(t) {
  const v = vis(t, 0, 3.6); if (v <= 0) return;
  ctx.save(); ctx.globalAlpha = v;
  drawPitch({ night: true });
  netBulge = 0; drawGoal();
  // nuage de pluie au-dessus du gardien
  const kx = GOAL_X - 40;
  ctx.fillStyle = '#5c6b80';
  for (const [dx, dy, r] of [[-60, 0, 50], [0, -25, 62], [60, 0, 50]]) { ctx.beginPath(); ctx.arc(kx + dx, P.y + 430 + dy, r, 0, Math.PI * 2); ctx.fill(); }
  ctx.strokeStyle = '#7fd1ff'; ctx.lineWidth = 4;
  for (let i = 0; i < 14; i++) {
    const rx = kx - 90 + rand(i) * 180, ry = P.y + 480 + ((t * 500 + rand(i + 9) * 200) % 220);
    ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx - 6, ry + 22); ctx.stroke();
  }
  drawStick(kx, G, 1.5, KEEPER, { t, face: -1, gloves: true, mood: 'sad' });
  const p1 = prog(t, 0.1, 0.35, easeBack);
  ctx.save(); ctx.translate(540, P.y + 120); ctx.scale(p1, p1);
  text('POURQUOI ÊTRE', 0, 0, 72, WHITE);
  ctx.restore();
  const p2 = prog(t, 0.4, 0.35, easeBack);
  ctx.save(); ctx.translate(380, P.y + 240); ctx.scale(p2, p2); ctx.rotate(-0.04);
  text('GARDIEN', 0, 0, 120, YELLOW);
  ctx.restore();
  const p3 = prog(t, 0.9, 0.35, easeBack);
  ctx.save(); ctx.translate(380, P.y + 360); ctx.scale(p3, p3);
  pill('C’EST HORRIBLE', 0, 0, 56, RED, WHITE, 36);
  ctx.restore();
  ctx.restore();
}

// 1. dix arrêts… personne ne s'en souvient
const SAVES = [3.9, 4.55, 5.2, 5.85, 6.5];
function sceneSaves(t) {
  const v = vis(t, 3.5, 9.2); if (v <= 0) return;
  ctx.save(); ctx.globalAlpha = v;
  const quiet = prog(t, 7.4, 0.4);
  drawPitch({ crowdDim: quiet });
  netBulge = 0; drawGoal();
  drawStick(200, G, 1.2, RIVAL, { t, kick: SAVES.some(s => t > s - 0.15 && t < s + 0.1) ? 1 : 0 });
  // gardien : saute en alternance haut / bas
  let jump = 0, rot = 0;
  SAVES.forEach((s, i) => {
    const k = clamp(1 - Math.abs(t - (s + 0.35)) / 0.3);
    jump = Math.max(jump, k * (i % 2 ? 40 : 120));
    if (k > 0) rot = (i % 2 ? 0.5 : -0.6) * k;
  });
  const kx = GOAL_X - 40;
  drawStick(kx, G - jump, 1.35, KEEPER, { t, face: -1, gloves: true, arms: jump > 5 ? 1 : 0, rot, mood: quiet > 0 ? 'sad' : 'smile' });
  // ballons
  SAVES.forEach((s, i) => {
    const k = (t - s) / 0.35;
    if (k < 0 || k > 2) return;
    const ty = G - (i % 2 ? 190 : 330);
    let bx, by;
    if (k <= 1) { bx = lerp(250, kx - 70, k); by = lerp(G - 20, ty, k) - Math.sin(k * Math.PI) * 60; }
    else { const r = k - 1; bx = lerp(kx - 70, kx - 300, r); by = ty - Math.sin(r * Math.PI) * 120 + r * 200; }
    drawBall(bx, by, 16, k * 6);
  });
  // compteur d'arrêts
  const n = SAVES.filter(s => t > s + 0.35).length * 2;
  ctx.save(); ctx.translate(540, P.y + 110);
  pill(`ARRÊTS : ${n}`, 0, 0, 58, '#0b0b0b', n >= 10 ? YELLOW : WHITE, 36);
  ctx.restore();
  if (quiet > 0) {
    text('… cri cri …', 540, P.y + 260, 56, WHITE, { alpha: quiet });
  }
  ctx.restore();
  caption(t, 3.6, 9.2, 'Tu arrêtes 10 tirs…', 'personne ne s’en souvient.', 7.4);
}

// 2. un seul but… c'est TA faute
function sceneGoal(t) {
  const v = vis(t, 9.0, 14.4); if (v <= 0) return;
  ctx.save(); ctx.globalAlpha = v;
  drawPitch();
  netBulge = t > 10.5 ? Math.max(0, 1 - (t - 10.5) / 0.8) : 0;
  drawGoal();
  const kx = GOAL_X - 40;
  const shocked = t > 10.3;
  drawStick(kx, G, 1.35, KEEPER, { t, face: -1, gloves: true, mood: shocked ? 'shock' : 'smile' });
  // ballon qui roule lentement entre les jambes
  const k = clamp((t - 9.4) / 1.2);
  if (t < 12) drawBall(lerp(300, GOAL_X + 70, easeInOut(k)), G - 18, 16, k * 20);
  // coéquipiers qui arrivent et accusent
  const comeIn = prog(t, 11.0, 0.7);
  const run = t > 11.0 && t < 11.7;
  drawStick(lerp(-60, 300, comeIn), G, 1.2, TEAM, { t, run, point: t > 11.7 ? 1 : 0, mood: 'shock' });
  drawStick(lerp(-200, 480, comeIn), G, 1.2, TEAM, { t: t + 0.3, run, point: t > 11.7 ? 1 : 0, mood: 'shock' });
  bubble('C’EST TA FAUTE !', 400, P.y + 380, 50, prog(t, 11.8, 0.3, easeBack), -60);
  text('BUT', GOAL_X + 60, P.y + 330, 70, RED, { alpha: t > 10.5 && t < 11.6 ? 1 : 0 });
  ctx.restore();
  caption(t, 9.1, 14.4, 'Tu prends UN seul but…', 'et c’est TA faute.', 11.6, RED);
}

// 3. 80 minutes seul dans le froid
function sceneCold(t) {
  const v = vis(t, 14.2, 19.4); if (v <= 0) return;
  ctx.save(); ctx.globalAlpha = v;
  drawPitch({ night: true, snow: true, t });
  netBulge = 0; drawGoal();
  // le match se joue très loin
  const far = (t - 14.2);
  drawStick(140 + Math.sin(far * 2) * 40, G - 90, 0.35, RIVAL, { t, run: 1 });
  drawStick(220 + Math.sin(far * 2 + 1) * 40, G - 90, 0.35, TEAM, { t: t + 0.2, run: 1 });
  drawBall(180 + Math.sin(far * 2 + 0.5) * 50, G - 96, 6, far * 5);
  // gardien qui grelotte
  const shiver = Math.sin(t * 60) * 4;
  drawStick(GOAL_X - 40 + shiver, G, 1.35, KEEPER, { t, face: -1, gloves: true, mood: 'sad' });
  // horloge qui défile
  const mins = Math.min(80, Math.floor(prog(t, 14.5, 3.5, x => clamp(x)) * 80));
  ctx.save(); ctx.translate(540, P.y + 110); pill(`${mins}’`, 0, 0, 70, '#0b0b0b', WHITE, 40); ctx.restore();
  text('brrr…', GOAL_X - 160, P.y + 470, 50, '#bfe3ff', { alpha: prog(t, 15.5, 0.3) });
  ctx.restore();
  caption(t, 14.3, 19.4, '80 minutes tout seul…', 'dans le froid.', 16.0, '#7fd1ff');
}

// 4. penalty : du mauvais côté
function scenePenalty(t) {
  const v = vis(t, 19.2, 24.4); if (v <= 0) return;
  ctx.save(); ctx.globalAlpha = v;
  const boo = prog(t, 21.6, 0.3);
  drawPitch({});
  netBulge = t > 21.2 ? Math.max(0, 1 - (t - 21.2) / 0.8) : 0;
  drawGoal();
  const kx = GOAL_X - 40;
  // tireur
  const runIn = prog(t, 19.8, 0.8, x => clamp(x));
  drawStick(lerp(250, 380, runIn), G, 1.25, RIVAL, { t, run: t > 19.8 && t < 20.6, kick: t > 20.6 && t < 21.0 ? 1 : 0 });
  // gardien plonge vers le haut, le ballon file au ras du sol
  const dive = prog(t, 20.7, 0.4);
  drawStick(kx + dive * 10, G - dive * 140, 1.35, KEEPER, { t, face: -1, gloves: true, arms: dive, rot: -dive * 1.2, mood: t > 21.3 ? 'shock' : 'smile' });
  const bk = clamp((t - 20.75) / 0.45);
  if (t < 21.2) drawBall(lerp(450, GOAL_X + 70, bk), G - 18, 16, bk * 10);
  else drawBall(GOAL_X + 70, G - 18, 16, 0);
  if (boo > 0) text('BOUHHH !', 540, P.y + 170, 90, RED, { alpha: boo });
  ctx.restore();
  caption(t, 19.3, 24.4, 'Penalty : tu plonges…', 'du mauvais côté.', 21.4);
}

// 5. à la récré
function sceneRecess(t) {
  const v = vis(t, 24.2, 29.4); if (v <= 0) return;
  ctx.save(); ctx.globalAlpha = v;
  // cour de récré
  const { x, y, w, h } = P;
  ctx.fillStyle = '#9fd3ff'; ctx.fillRect(x, y, w, GROUND - y);
  ctx.fillStyle = '#c9a77c'; ctx.fillRect(x, GROUND - 80, w, y + h - GROUND + 80);
  ctx.fillStyle = '#b5482f'; ctx.fillRect(x, GROUND - 330, w, 250);
  ctx.strokeStyle = 'rgba(0,0,0,.15)'; ctx.lineWidth = 3;
  for (let r = 0; r < 6; r++) for (let c = 0; c < 12; c++) ctx.strokeRect(x + c * 80 + (r % 2) * 40, GROUND - 330 + r * 42, 80, 42);
  // deux capitaines
  drawStick(170, G, 1.25, TEAM, { t, point: t > 27.2 ? 1 : 0 });
  drawStick(300, G, 1.25, RIVAL, { t: t + 0.4 });
  // enfants choisis un par un
  const kids = [[24.7, '#8338ec'], [25.3, '#06d6a0'], [25.9, '#ef476f']];
  kids.forEach(([at, col], i) => {
    const k = prog(t, at, 0.5);
    const start = 560 + i * 120, end = [95, 400, 490][i];
    drawStick(lerp(start, end, k), G, 1.05, col, { t, run: k > 0 && k < 1 ? 1 : 0, face: k > 0 && k < 1 ? -1 : 1 });
  });
  drawStick(900, G, 1.05, KEEPER, { t, face: -1, mood: t > 27.4 ? 'sad' : 'smile' });
  bubble('Toi… t’es gardien.', 360, P.y + 420, 50, prog(t, 27.2, 0.3, easeBack), -150);
  ctx.restore();
  caption(t, 24.3, 29.4, 'À la récré, le dernier choisi…', 'finit gardien.', 27.6);
}

function sceneOutro(t) {
  const v = vis(t, 29.2, 99); if (v <= 0) return;
  ctx.save(); ctx.globalAlpha = v;
  drawPitch({ night: true });
  netBulge = 0; drawGoal();
  drawStick(540, G, 1.7, KEEPER, { t, gloves: true, arms: prog(t, 29.5, 0.4), mood: 'smile' });
  for (let i = 0; i < 50; i++) {
    const life = t - 29.5; if (life < 0) break;
    const cx = P.x + rand(i) * P.w, cy = P.y + (rand(i + 3) * 200 + life * (220 + rand(i + 9) * 200)) % P.h;
    ctx.fillStyle = [YELLOW, WHITE, KEEPER][i % 3]; ctx.fillRect(cx + Math.sin(life * 4 + i) * 20, cy, 12, 18);
  }
  const p = prog(t, 29.6, 0.35, easeBack);
  ctx.save(); ctx.translate(540, P.y + 150); ctx.scale(p, p);
  text('RESPECT', 0, 0, 110, YELLOW); text('AUX GARDIENS', 0, 110, 72, WHITE);
  ctx.restore();
  ctx.restore();
  caption(t, 29.4, 99, 'Identifie un gardien', 'en commentaire', 30.4);
}

function drawProgress(t) {
  ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(0, 0, W, 10);
  ctx.fillStyle = YELLOW; ctx.fillRect(0, 0, W * clamp(t / DURATION), 10);
}

function render(t) {
  t = clamp(t, 0, DURATION);
  ctx.fillStyle = '#04110a'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  roundRect(P.x, P.y, P.w, P.h, 30); ctx.clip();
  ctx.fillStyle = '#071a10'; ctx.fillRect(P.x, P.y, P.w, P.h);
  ctx.restore();
  // scènes : décor clipé dans le cadre, titres dessous
  const scenes = [sceneHook, sceneSaves, sceneGoal, sceneCold, scenePenalty, sceneRecess, sceneOutro];
  for (const scene of scenes) {
    ctx.save(); roundRect(P.x, P.y, P.w, H - P.y, 30); ctx.clip(); scene(t); ctx.restore();
  }
  ctx.strokeStyle = 'rgba(255,255,255,.2)'; ctx.lineWidth = 4;
  roundRect(P.x, P.y, P.w, P.h, 30); ctx.stroke();
  drawProgress(t);
}
window.renderAt = render;

const playBtn = document.getElementById('play');
const sfx = document.getElementById('sfx');
playBtn.addEventListener('click', () => {
  playBtn.hidden = true;
  sfx.currentTime = 0;
  const start = performance.now();
  sfx.play().catch(() => {});
  const loop = now => {
    const t = !sfx.paused && sfx.currentTime > 0 ? sfx.currentTime : (now - start) / 1000;
    render(t);
    if (t < DURATION) requestAnimationFrame(loop);
    else { playBtn.textContent = '↻ Rejouer'; playBtn.hidden = false; }
  };
  requestAnimationFrame(loop);
});

render(1.6);
</script>

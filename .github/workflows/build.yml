name: Construire l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compiler
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AgentTablette-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publier l'APK (lien direct, sans compte)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AgentTablette.apk
          gh release create agent-tablette-v1 AgentTablette.apk --target "${{ github.ref_name }}" \
            --title "Agent Tablette" --notes "APK pour Galaxy Tab S7" \
            || gh release upload agent-tablette-v1 AgentTablette.apk --clobber

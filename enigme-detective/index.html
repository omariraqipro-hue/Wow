const rand = n => { const x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); };

const BLACKOUT_AT = 2.7;
const COUNT_START = 7;
const REVEAL_AT = 17;
const LIAR = 'C';

const SUSPECTS = [
  { letter: 'A', quote: '« Je lisais à la bougie. »', color: '#4da3ff' },
  { letter: 'B', quote: '« J’ai entendu un cri. »', color: '#c77dff' },
  { letter: 'C', quote: '« J’ai pris l’ascenseur. »', color: '#3ddc97' },
];

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function text(str, x, y, size, color, { align = 'center', alpha = 1, shadow = true } = {}) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.font = `bold ${size}px ${FONT}`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  if (shadow) { ctx.shadowColor = 'rgba(0,0,0,.85)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 4; }
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
  ctx.restore();
}

function pill(str, x, y, size, bg, fg, padX = 40) {
  ctx.save();
  ctx.font = `bold ${size}px ${FONT}`;
  const w = ctx.measureText(str).width + padX * 2, h = size * 1.7;
  ctx.fillStyle = bg; roundRect(x - w / 2, y - h / 2, w, h, h / 2); ctx.fill();
  ctx.restore();
  text(str, x, y + 2, size, fg, { shadow: false });
}

// secousse d'écran (blackout et révélation)
function shakeOffset(t) {
  const s = Math.max(0, 1 - Math.abs(t - BLACKOUT_AT - 0.1) / 0.35) + Math.max(0, 1 - Math.abs(t - REVEAL_AT - 0.05) / 0.3);
  if (s <= 0) return [0, 0];
  return [(rand(Math.floor(t * 60)) - 0.5) * 30 * s, (rand(Math.floor(t * 60) + 7) - 0.5) * 30 * s];
}

function drawBackground(t) {
  const g = ctx.createRadialGradient(W / 2, H * 0.4, 100, W / 2, H * 0.45, H * 0.8);
  g.addColorStop(0, '#1a2238');
  g.addColorStop(1, '#05070d');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

// ---- 0–2 s : accroche ----
function drawIntro(t) {
  const out = 1 - prog(t, 1.75, 0.3);
  if (out <= 0) return;
  ctx.save();
  ctx.globalAlpha = out;
  const zoom = 1 + 0.06 * t; // lente poussée caméra
  ctx.translate(540, 960); ctx.scale(zoom, zoom); ctx.translate(-540, -960);

  const s = prog(t, 0, 0.45, easeBack);
  ctx.save();
  ctx.translate(540, 560); ctx.scale(s, s); ctx.rotate(-0.3 + 0.3 * s);
  ctx.lineWidth = 26; ctx.strokeStyle = YELLOW; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(-20, -20, 105, 0, Math.PI * 2); ctx.stroke();
  ctx.lineWidth = 40;
  ctx.beginPath(); ctx.moveTo(60, 60); ctx.lineTo(150, 150); ctx.stroke();
  ctx.restore();

  text('ÉNIGME DE DÉTECTIVE', 540, 820, 46, GREY, { alpha: prog(t, 0.1, 0.3) });
  const p1 = prog(t, 0.15, 0.35, easeBack);
  ctx.save(); ctx.translate(540, 970); ctx.scale(p1, p1);
  text('Quel suspect', 0, 0, 120, WHITE);
  ctx.restore();
  const p2 = prog(t, 0.45, 0.3, easeBack);
  const jitter = t > 0.45 && t < 0.9 ? (rand(Math.floor(t * 40)) - 0.5) * 14 : 0;
  ctx.save(); ctx.translate(540 + jitter, 1120); ctx.scale(p2, p2);
  text('ment ?', 0, 0, 170, RED);
  ctx.restore();

  const p3 = prog(t, 0.85, 0.35, easeBack);
  ctx.save(); ctx.translate(540, 1340); ctx.scale(p3, p3);
  pill('Tu as 10 secondes.', 0, 0, 66, YELLOW, '#111', 50);
  ctx.restore();
  ctx.restore();
}

// ---- Immeuble dans la nuit ----
const PANEL = { x: 70, y: 170, w: 940, h: 600 };
const FLOORS = 7, COLS = 4;

function windowLitFlicker(t, i) {
  // vacillement juste avant la coupure
  if (t < BLACKOUT_AT - 0.25) return true;
  if (t < BLACKOUT_AT) return rand(i + Math.floor(t * 25)) > 0.35;
  return false;
}

function drawBuilding(t) {
  const appear = prog(t, 2.0, 0.45);
  if (appear <= 0) return;
  const { x, y, w, h } = PANEL;
  ctx.save();
  ctx.globalAlpha = appear;
  ctx.translate(0, (1 - appear) * 60);

  ctx.save();
  roundRect(x, y, w, h, 28); ctx.clip();
  // ciel
  const sky = ctx.createLinearGradient(0, y, 0, y + h);
  sky.addColorStop(0, '#0d1633'); sky.addColorStop(1, '#1d2a4d');
  ctx.fillStyle = sky; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = 'rgba(255,255,255,.8)';
  for (let i = 0; i < 40; i++) ctx.fillRect(x + rand(i) * w, y + rand(i + 99) * 220, 3, 3);
  ctx.fillStyle = '#f4f1de'; ctx.beginPath(); ctx.arc(x + 130, y + 110, 44, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#0d1633'; ctx.beginPath(); ctx.arc(x + 150, y + 98, 40, 0, Math.PI * 2); ctx.fill();

  // immeubles voisins
  ctx.fillStyle = '#121a30';
  ctx.fillRect(x + 20, y + 300, 200, h); ctx.fillRect(x + w - 220, y + 260, 200, h);
  // immeuble principal
  const bx = x + 290, by = y + 110, bw = 360, bh = h - 110;
  ctx.fillStyle = '#232c45'; ctx.fillRect(bx, by, bw, bh);
  ctx.fillStyle = '#1a2136'; ctx.fillRect(bx - 12, by - 14, bw + 24, 18);
  const ww = 52, wh = 44, gx = (bw - COLS * ww) / (COLS + 1), gy = 22;
  let i = 0;
  for (let f = 0; f < FLOORS; f++) {
    for (let c = 0; c < COLS; c++, i++) {
      const wx = bx + gx + c * (ww + gx), wy = by + 26 + f * (wh + gy);
      const lit = rand(i + 3) > 0.25 && windowLitFlicker(t, i);
      ctx.fillStyle = lit ? '#ffd770' : '#0b0f1c';
      ctx.fillRect(wx, wy, ww, wh);
      if (lit) { ctx.fillStyle = 'rgba(255,215,112,.18)'; ctx.fillRect(wx - 8, wy - 8, ww + 16, wh + 16); }
    }
  }
  // fenêtre éclairée à la bougie (suspect A) : petite lueur après la coupure
  if (t > BLACKOUT_AT + 0.6) {
    const flick = 0.6 + 0.4 * rand(Math.floor(t * 12));
    ctx.fillStyle = `rgba(255,150,60,${0.55 * flick})`;
    ctx.fillRect(bx + gx, by + 26 + 2 * (wh + gy), ww, wh);
  }

  // obscurité après la coupure + faisceau de lampe torche
  const dark = prog(t, BLACKOUT_AT, 0.25) * 0.72;
  if (dark > 0) {
    ctx.fillStyle = `rgba(0,0,6,${dark})`; ctx.fillRect(x, y, w, h);
  }
  if (t > COUNT_START - 1 && t < REVEAL_AT) {
    const fx = x + w / 2 + Math.sin(t * 1.3) * 300, fy = y + 300 + Math.cos(t * 0.9) * 140;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const beam = ctx.createRadialGradient(fx, fy, 10, fx, fy, 170);
    beam.addColorStop(0, 'rgba(255,240,200,.35)'); beam.addColorStop(1, 'rgba(255,240,200,0)');
    ctx.fillStyle = beam; ctx.fillRect(x, y, w, h);
    ctx.restore();
  }
  // flash à la coupure
  const flash = Math.max(0, 1 - Math.abs(t - BLACKOUT_AT) / 0.12);
  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${0.5 * flash})`; ctx.fillRect(x, y, w, h); }
  ctx.restore();

  ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 4;
  roundRect(x, y, w, h, 28); ctx.stroke();

  if (t > BLACKOUT_AT) {
    const p = prog(t, BLACKOUT_AT + 0.1, 0.3, easeBack);
    ctx.save(); ctx.translate(x + w - 240, y + 60); ctx.scale(p, p);
    ctx.fillStyle = RED; roundRect(-200, -34, 400, 68, 34); ctx.fill();
    text('PANNE DE COURANT', 0, 2, 36, WHITE, { shadow: false });
    ctx.restore();
  }
  ctx.restore();
}

function drawCaptions(t) {
  if (t >= COUNT_START) return;
  const p1 = prog(t, BLACKOUT_AT + 0.2, 0.4);
  if (p1 > 0) text('Tout l’immeuble est dans le noir.', 540, 840, 50, WHITE, { alpha: p1 });
  const p2 = prog(t, 3.5, 0.4, easeBack);
  if (p2 > 0) {
    ctx.save(); ctx.translate(540, 920); ctx.scale(p2, p2);
    text('Un coffre est vidé. Qui ment ?', 0, 0, 54, YELLOW);
    ctx.restore();
  }
}

// appel à commenter pendant le compte à rebours
function drawCTA(t) {
  if (t < COUNT_START || t >= REVEAL_AT) return;
  const p = prog(t, COUNT_START, 0.4, easeBack);
  const pulse = 1 + 0.04 * Math.sin(t * 8);
  ctx.save(); ctx.translate(540, 880); ctx.scale(p * pulse, p * pulse);
  pill('Écris A, B ou C en commentaire', 0, 0, 46, '#ffffff', '#111', 36);
  ctx.restore();
}

// ---- Témoignages ----
const CARD_Y = [990, 1178, 1366], CARD_H = 160;
const CARD_IN = [4.2, 4.8, 5.4];

function drawCards(t) {
  const reveal = prog(t, REVEAL_AT, 0.35);
  SUSPECTS.forEach((s, i) => {
    const p = prog(t, CARD_IN[i], 0.4, easeBack);
    if (p <= 0) return;
    const isLiar = s.letter === LIAR;
    ctx.save();
    ctx.globalAlpha = clamp((t - CARD_IN[i]) / 0.25) * (isLiar ? 1 : 1 - 0.7 * reveal);
    const y = CARD_Y[i];
    const scale = isLiar ? 1 + 0.06 * reveal : 1;
    ctx.translate(540 + (1 - p) * 700, y + CARD_H / 2);
    ctx.scale(scale, scale);

    if (isLiar && reveal > 0) {
      ctx.save();
      ctx.shadowColor = YELLOW; ctx.shadowBlur = 60 * reveal;
      ctx.fillStyle = `rgba(255,210,63,${0.9 * reveal})`;
      roundRect(-478, -CARD_H / 2 - 8, 956, CARD_H + 16, 34); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = isLiar && reveal > 0 ? '#2a2410' : '#141a2a';
    roundRect(-470, -CARD_H / 2, 940, CARD_H, 28); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.15)'; ctx.lineWidth = 3;
    roundRect(-470, -CARD_H / 2, 940, CARD_H, 28); ctx.stroke();

    ctx.fillStyle = s.color;
    ctx.beginPath(); ctx.arc(-370, 0, 56, 0, Math.PI * 2); ctx.fill();
    text(s.letter, -370, 3, 70, '#0b0f1a', { shadow: false });
    text(s.quote, -285, 2, 54, WHITE, { align: 'left', shadow: false });

    if (isLiar && reveal > 0) {
      const st = prog(t, REVEAL_AT + 0.25, 0.3, easeBack);
      ctx.save(); ctx.translate(390, -78); ctx.rotate(-0.12); ctx.scale(st, st);
      ctx.fillStyle = RED; roundRect(-90, -32, 180, 64, 12); ctx.fill();
      text('MENT', 0, 3, 44, WHITE, { shadow: false });
      ctx.restore();
    }
    ctx.restore();
  });

  if (reveal > 0) {
    const cy = CARD_Y[2] + CARD_H / 2;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(540, cy, 40, 540, cy, 560);
    g.addColorStop(0, `rgba(255,220,120,${0.22 * reveal})`);
    g.addColorStop(1, 'rgba(255,220,120,0)');
    ctx.fillStyle = g; ctx.fillRect(0, cy - 500, W, 1000);
    ctx.restore();
  }
}

// ---- Compte à rebours (7–17 s) ----
function drawCountdown(t) {
  if (t < COUNT_START || t >= REVEAL_AT + 0.3) return;
  const fade = t >= REVEAL_AT ? 1 - prog(t, REVEAL_AT, 0.25) : prog(t, COUNT_START, 0.25);
  const elapsed = Math.min(t - COUNT_START, 9.999);
  const n = 10 - Math.floor(elapsed);
  const frac = elapsed - Math.floor(elapsed);
  const urgent = n <= 3;
  const cx = 540, cy = PANEL.y + PANEL.h / 2 + 30, r = 190;
  ctx.save();
  ctx.globalAlpha = fade;
  ctx.fillStyle = 'rgba(5,7,13,.82)';
  ctx.beginPath(); ctx.arc(cx, cy, r + 30, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = 22; ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(255,255,255,.12)';
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = urgent ? RED : YELLOW;
  const remaining = 1 - (t - COUNT_START) / 10;
  ctx.beginPath(); ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * clamp(remaining)); ctx.stroke();
  const pop = 1 + (urgent ? 0.5 : 0.35) * (1 - easeOut(frac / 0.25));
  ctx.save(); ctx.translate(cx, cy); ctx.scale(pop, pop);
  text(String(n), 0, 8, 200, urgent ? RED : WHITE);
  ctx.restore();
  const tick = frac < 0.15;
  text(n % 2 === 0 ? 'tic' : 'tac', cx + r + 20, cy - r + 10, 44, tick ? YELLOW : GREY, { alpha: tick ? 1 : 0.5, align: 'left' });
  ctx.restore();

  // battement rouge sur les bords pendant les 3 dernières secondes
  if (urgent && t < REVEAL_AT) {
    const beat = Math.pow(1 - frac, 3);
    const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.75);
    v.addColorStop(0, 'rgba(255,0,0,0)');
    v.addColorStop(1, `rgba(255,0,0,${0.45 * beat})`);
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  }
}

// ---- Révélation (17–20 s) ----
function drawReveal(t) {
  if (t < REVEAL_AT) return;
  const { x, y, w, h } = PANEL;
  const bg = prog(t, REVEAL_AT, 0.3);
  ctx.save();
  ctx.globalAlpha = bg;
  ctx.fillStyle = '#0b0f1a'; roundRect(x, y, w, h, 28); ctx.fill();
  ctx.strokeStyle = YELLOW; ctx.lineWidth = 5; roundRect(x, y, w, h, 28); ctx.stroke();
  ctx.restore();

  const p1 = prog(t, REVEAL_AT + 0.15, 0.35, easeBack);
  ctx.save(); ctx.translate(540, y + 120); ctx.scale(p1, p1);
  text('C ment !', 0, 0, 140, RED);
  ctx.restore();

  const p2 = prog(t, REVEAL_AT + 0.5, 0.35);
  ['Pendant la panne,', 'l’ascenseur ne pouvait', 'pas fonctionner.'].forEach((line, i) => {
    text(line, 540, y + 260 + i * 72 + (1 - p2) * 30, 60, WHITE, { alpha: p2 });
  });

  const p3 = prog(t, 18.5, 0.4, easeBack);
  if (p3 > 0) {
    ctx.save(); ctx.translate(540, y + h - 70); ctx.scale(p3, p3);
    pill('T’avais trouvé ?', 0, 0, 62, YELLOW, '#111', 60);
    ctx.restore();
  }
}

// barre de progression (incite à regarder jusqu'au bout)
function drawProgress(t) {
  ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(0, 0, W, 10);
  ctx.fillStyle = YELLOW; ctx.fillRect(0, 0, W * clamp(t / DURATION), 10);
}

function drawRevealFlash(t) {
  const f = Math.max(0, 1 - Math.abs(t - REVEAL_AT) / 0.15);
  if (f > 0) { ctx.fillStyle = `rgba(255,255,255,${0.6 * f})`; ctx.fillRect(0, 0, W, H); }
}

function render(t) {
  t = clamp(t, 0, DURATION);
  drawBackground(t);
  ctx.save();
  const [sx, sy] = shakeOffset(t);
  ctx.translate(sx, sy);
  drawIntro(t);
  if (t >= 2) {
    drawBuilding(t);
    drawCaptions(t);
    drawCTA(t);
    drawCards(t);
    drawCountdown(t);
    drawReveal(t);
  }
  ctx.restore();
  drawRevealFlash(t);
  drawProgress(t);
}
window.renderAt = render; // utilisé pour l'export MP4

// ---- Lecture synchronisée sur la bande son ----
const playBtn = document.getElementById('play');
const sfx = document.getElementById('sfx');
playBtn.addEventListener('click', () => {
  playBtn.hidden = true;
  sfx.currentTime = 0;
  const start = performance.now();
  sfx.play().catch(() => {}); // la vidéo reste lisible sans le son
  const loop = now => {
    const t = !sfx.paused && sfx.currentTime > 0 ? sfx.currentTime : (now - start) / 1000;
    render(t);
    if (t < DURATION) requestAnimationFrame(loop);
    else { playBtn.textContent = '↻ Rejouer'; playBtn.hidden = false; }
  };
  requestAnimationFrame(loop);
});

render(1.2); // aperçu avant lecture
</script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Énigme du détective</title>
<style>
  :root { --bg: #05070d; --accent: #ffd23f; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { display: flex; align-items: center; justify-content: center; font-family: Arial, Helvetica, sans-serif; }
  .stage { position: relative; height: 100vh; max-width: 100vw; aspect-ratio: 9 / 16; }
  canvas { width: 100%; height: 100%; display: block; border-radius: 12px; }
  #play {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    padding: 18px 40px; font-size: 26px; font-weight: 700; border: 0; border-radius: 999px;
    background: var(--accent); color: #111; cursor: pointer; box-shadow: 0 8px 30px rgba(0,0,0,.5);
  }
  #play:hover { filter: brightness(1.08); }
  #play:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  #play[hidden] { display: none; }
</style>
</head>
<body>
<div class="stage">
  <canvas id="c" width="1080" height="1920"></canvas>
  <button id="play" type="button">▶ Lecture</button>
</div>
<script>
const W = 1080, H = 1920, DURATION = 20;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const FONT = 'Arial, "Liberation Sans", Helvetica, sans-serif';
const YELLOW = '#ffd23f', RED = '#ff4d4d', WHITE = '#ffffff', GREY = '#9aa3b5';

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const easeBack = x => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
// progression 0→1 entre start et start+dur
const prog = (t, start, dur, fn = easeOut) => fn((t - start) / dur);

const SUSPECTS = [
  { letter: 'A', quote: '« J’ai entendu un bruit. »', color: '#4da3ff' },
  { letter: 'B', quote: '« J’ai vu un chat noir. »', color: '#c77dff' },
  { letter: 'C', quote: '« J’ai touché la table. »', color: '#3ddc97' },
];

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function text(str, x, y, size, color, { weight = 'bold', align = 'center', alpha = 1, shadow = true } = {}) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.font = `${weight} ${size}px ${FONT}`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  if (shadow) { ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 4; }
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
  ctx.restore();
}

function drawBackground(t) {
  const g = ctx.createRadialGradient(W / 2, H * 0.4, 100, W / 2, H * 0.45, H * 0.8);
  g.addColorStop(0, '#1a2238');
  g.addColorStop(1, '#05070d');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

// ---- Scène 1 : titre (0–2 s) ----
function drawIntro(t) {
  const out = 1 - prog(t, 1.75, 0.3);
  if (out <= 0) return;
  ctx.save();
  ctx.globalAlpha = out;

  // loupe
  const s = prog(t, 0, 0.5, easeBack);
  ctx.save();
  ctx.translate(540, 560);
  ctx.scale(s, s);
  ctx.rotate(-0.3 + 0.3 * s);
  ctx.lineWidth = 26; ctx.strokeStyle = YELLOW; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(-20, -20, 105, 0, Math.PI * 2); ctx.stroke();
  ctx.lineWidth = 40;
  ctx.beginPath(); ctx.moveTo(60, 60); ctx.lineTo(150, 150); ctx.stroke();
  ctx.restore();

  text('ÉNIGME DE DÉTECTIVE', 540, 820, 46, GREY, { alpha: prog(t, 0.15, 0.4) });
  const p1 = prog(t, 0.25, 0.45, easeBack);
  ctx.save(); ctx.translate(540, 980); ctx.scale(p1, p1);
  text('Quel suspect', 0, 0, 120, WHITE);
  text('ment ?', 0, 140, 150, YELLOW);
  ctx.restore();

  const p2 = prog(t, 0.8, 0.4, easeBack);
  ctx.save(); ctx.translate(540, 1330); ctx.scale(p2, p2);
  ctx.fillStyle = RED; roundRect(-370, -62, 740, 124, 62); ctx.fill();
  text('Tu as 10 secondes.', 0, 2, 64, WHITE, { shadow: false });
  ctx.restore();
  ctx.restore();
}

// ---- Pièce sans fenêtre ----
const ROOM = { x: 70, y: 170, w: 940, h: 600 };
const LAMP_OFF_AT = 3.4;

function drawRoom(t) {
  const appear = prog(t, 2.0, 0.5);
  if (appear <= 0) return;
  const { x, y, w, h } = ROOM;
  ctx.save();
  ctx.globalAlpha = appear;
  ctx.translate(0, (1 - appear) * 60);

  ctx.save();
  roundRect(x, y, w, h, 28); ctx.clip();
  // mur du fond (aucune fenêtre)
  ctx.fillStyle = '#6b5a4a'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#7d6a57'; ctx.fillRect(x + 150, y + 60, w - 300, h - 260);
  // murs latéraux et sol en perspective
  ctx.fillStyle = '#5a4b3e';
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 150, y + 60); ctx.lineTo(x + 150, y + h - 200); ctx.lineTo(x, y + h); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x + w, y); ctx.lineTo(x + w - 150, y + 60); ctx.lineTo(x + w - 150, y + h - 200); ctx.lineTo(x + w, y + h); ctx.fill();
  ctx.fillStyle = '#3e3229';
  ctx.beginPath(); ctx.moveTo(x, y + h); ctx.lineTo(x + 150, y + h - 200); ctx.lineTo(x + w - 150, y + h - 200); ctx.lineTo(x + w, y + h); ctx.fill();
  // porte fermée
  ctx.fillStyle = '#4a3828'; ctx.fillRect(x + w - 300, y + 170, 110, 230);
  ctx.fillStyle = YELLOW; ctx.beginPath(); ctx.arc(x + w - 210, y + 290, 7, 0, Math.PI * 2); ctx.fill();
  // table
  ctx.fillStyle = '#2c2119';
  ctx.fillRect(x + 360, y + 430, 220, 26);
  ctx.fillRect(x + 375, y + 456, 18, 90); ctx.fillRect(x + 547, y + 456, 18, 90);

  // lampe
  const lampOn = t < LAMP_OFF_AT || (t < LAMP_OFF_AT + 0.3 && Math.floor(t * 20) % 2 === 0);
  const lx = x + w / 2, ly = y + 170;
  if (lampOn) {
    const cone = ctx.createRadialGradient(lx, ly, 10, lx, ly + 200, 420);
    cone.addColorStop(0, 'rgba(255,230,150,.55)');
    cone.addColorStop(1, 'rgba(255,230,150,0)');
    ctx.fillStyle = cone; ctx.fillRect(x, y, w, h);
  }
  // obscurité
  const dark = prog(t, LAMP_OFF_AT + 0.2, 0.5) * 0.88;
  ctx.fillStyle = `rgba(0,0,0,${dark})`; ctx.fillRect(x, y, w, h);
  // fil + abat-jour + ampoule (restent visibles en silhouette)
  ctx.strokeStyle = '#222'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(lx, y); ctx.lineTo(lx, ly - 50); ctx.stroke();
  ctx.fillStyle = lampOn ? '#3a3a3a' : '#2a2d36';
  ctx.beginPath(); ctx.moveTo(lx - 30, ly - 55); ctx.lineTo(lx + 30, ly - 55); ctx.lineTo(lx + 75, ly); ctx.lineTo(lx - 75, ly); ctx.fill();
  ctx.fillStyle = lampOn ? '#fff3b0' : '#4a4f5c';
  ctx.beginPath(); ctx.arc(lx, ly + 12, 22, 0, Math.PI * 2); ctx.fill();
  if (!lampOn) {
    const off = prog(t, LAMP_OFF_AT + 0.3, 0.3, easeBack);
    ctx.save(); ctx.translate(lx + 120, ly - 10); ctx.scale(off, off);
    ctx.fillStyle = '#1b1f2a'; roundRect(-58, -30, 116, 60, 30); ctx.fill();
    ctx.strokeStyle = RED; ctx.lineWidth = 4; roundRect(-58, -30, 116, 60, 30); ctx.stroke();
    text('OFF', 0, 2, 34, RED, { shadow: false });
    ctx.restore();
  }
  ctx.restore();

  ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 4;
  roundRect(x, y, w, h, 28); ctx.stroke();
  // étiquette
  const lab = prog(t, 2.3, 0.4);
  ctx.globalAlpha = appear * lab;
  ctx.fillStyle = 'rgba(0,0,0,.65)'; roundRect(x + 24, y + 24, 400, 64, 32); ctx.fill();
  text('Aucune fenêtre', x + 224, y + 57, 38, WHITE, { shadow: false });
  ctx.restore();
}

function drawCaptions(t) {
  const p1 = prog(t, 2.3, 0.4);
  if (p1 <= 0) return;
  text('Une seule lampe.', 540, 840, 54, WHITE, { alpha: p1 });
  const p2 = prog(t, LAMP_OFF_AT, 0.4, easeBack);
  if (p2 > 0) {
    ctx.save(); ctx.translate(540, 920); ctx.scale(p2, p2);
    text('Lampe éteinte = noir complet', 0, 0, 54, YELLOW);
    ctx.restore();
  }
}

// ---- Témoignages ----
const CARD_Y = [990, 1178, 1366], CARD_H = 160;
const CARD_IN = [4.3, 4.9, 5.5];
const REVEAL_AT = 17;

function drawCards(t) {
  const reveal = prog(t, REVEAL_AT, 0.4);
  SUSPECTS.forEach((s, i) => {
    const p = prog(t, CARD_IN[i], 0.45, easeBack);
    if (p <= 0) return;
    const isLiar = s.letter === 'B';
    ctx.save();
    ctx.globalAlpha = clamp((t - CARD_IN[i]) / 0.25) * (isLiar ? 1 : 1 - 0.7 * reveal);
    const y = CARD_Y[i];
    const scale = isLiar ? 1 + 0.06 * reveal : 1;
    ctx.translate(540 + (1 - p) * 700, y + CARD_H / 2);
    ctx.scale(scale, scale);

    if (isLiar && reveal > 0) {
      ctx.save();
      ctx.shadowColor = YELLOW; ctx.shadowBlur = 60 * reveal;
      ctx.fillStyle = `rgba(255,210,63,${0.9 * reveal})`;
      roundRect(-478, -CARD_H / 2 - 8, 956, CARD_H + 16, 34); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = isLiar && reveal > 0 ? '#2a2410' : '#141a2a';
    roundRect(-470, -CARD_H / 2, 940, CARD_H, 28); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.15)'; ctx.lineWidth = 3;
    roundRect(-470, -CARD_H / 2, 940, CARD_H, 28); ctx.stroke();

    ctx.fillStyle = s.color;
    ctx.beginPath(); ctx.arc(-370, 0, 56, 0, Math.PI * 2); ctx.fill();
    text(s.letter, -370, 3, 70, '#0b0f1a', { shadow: false });
    text(s.quote, -285, 2, 54, WHITE, { align: 'left', shadow: false });

    if (isLiar && reveal > 0) {
      const st = prog(t, REVEAL_AT + 0.3, 0.35, easeBack);
      ctx.save(); ctx.translate(390, -78); ctx.rotate(-0.12); ctx.scale(st, st);
      ctx.fillStyle = RED; roundRect(-90, -32, 180, 64, 12); ctx.fill();
      text('MENT', 0, 3, 44, WHITE, { shadow: false });
      ctx.restore();
    }
    ctx.restore();
  });

  // projecteur sur B
  if (reveal > 0) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(540, CARD_Y[1] + CARD_H / 2, 40, 540, CARD_Y[1] + CARD_H / 2, 560);
    g.addColorStop(0, `rgba(255,220,120,${0.22 * reveal})`);
    g.addColorStop(1, 'rgba(255,220,120,0)');
    ctx.fillStyle = g; ctx.fillRect(0, CARD_Y[1] - 400, W, 1000);
    ctx.restore();
  }
}

// ---- Compte à rebours (7–17 s) ----
function drawCountdown(t) {
  if (t < 7 || t >= REVEAL_AT + 0.3) return;
  const fade = t >= REVEAL_AT ? 1 - prog(t, REVEAL_AT, 0.3) : prog(t, 7, 0.25);
  const elapsed = Math.min(t - 7, 9.999);
  const n = 10 - Math.floor(elapsed);
  const frac = elapsed - Math.floor(elapsed);
  const urgent = n <= 3;
  const cx = 540, cy = ROOM.y + ROOM.h / 2, r = 200;
  ctx.save();
  ctx.globalAlpha = fade;
  ctx.fillStyle = 'rgba(5,7,13,.85)';
  ctx.beginPath(); ctx.arc(cx, cy, r + 30, 0, Math.PI * 2); ctx.fill();
  // anneau : temps restant total
  ctx.lineWidth = 22; ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(255,255,255,.12)';
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = urgent ? RED : YELLOW;
  const remaining = 1 - (t - 7) / 10;
  ctx.beginPath(); ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * clamp(remaining)); ctx.stroke();
  // chiffre avec « pop » à chaque seconde
  const pop = 1 + 0.35 * (1 - easeOut(frac / 0.25));
  ctx.save(); ctx.translate(cx, cy); ctx.scale(pop, pop);
  text(String(n), 0, 8, 210, urgent ? RED : WHITE);
  ctx.restore();
  // indicateur visuel du tic-tac (son facultatif)
  const tick = frac < 0.15;
  text(n % 2 === 0 ? 'tic' : 'tac', cx + r + 20, cy - r + 10, 44, tick ? YELLOW : GREY, { alpha: tick ? 1 : 0.5, align: 'left' });
  ctx.restore();
}

// ---- Révélation (17–20 s) ----
function drawReveal(t) {
  if (t < REVEAL_AT) return;
  const { x, y, w, h } = ROOM;
  const bg = prog(t, REVEAL_AT, 0.4);
  ctx.save();
  ctx.globalAlpha = bg;
  ctx.fillStyle = '#0b0f1a'; roundRect(x, y, w, h, 28); ctx.fill();
  ctx.strokeStyle = YELLOW; ctx.lineWidth = 5; roundRect(x, y, w, h, 28); ctx.stroke();
  ctx.restore();

  const p1 = prog(t, REVEAL_AT + 0.2, 0.4, easeBack);
  ctx.save(); ctx.translate(540, y + 120); ctx.scale(p1, p1);
  text('B ment.', 0, 0, 140, RED);
  ctx.restore();

  const p2 = prog(t, REVEAL_AT + 0.6, 0.4);
  ['Dans le noir complet,', 'il ne pouvait pas', 'voir le chat.'].forEach((line, i) => {
    text(line, 540, y + 260 + i * 72 + (1 - p2) * 30, 60, WHITE, { alpha: p2 });
  });

  const p3 = prog(t, 18.6, 0.45, easeBack);
  if (p3 > 0) {
    ctx.save(); ctx.translate(540, y + h - 70); ctx.scale(p3, p3);
    ctx.fillStyle = YELLOW; roundRect(-330, -52, 660, 104, 52); ctx.fill();
    text('T’avais trouvé ?', 0, 3, 62, '#111', { shadow: false });
    ctx.restore();
  }
}

function render(t) {
  t = clamp(t, 0, DURATION);
  drawBackground(t);
  drawIntro(t);
  if (t >= 2) {
    drawRoom(t);
    drawCaptions(t);
    drawCards(t);
    drawCountdown(t);
    drawReveal(t);
  }
}
window.renderAt = render; // utilisé pour l'export MP4

// ---- Son (facultatif, Web Audio) ----
function scheduleSounds(ac) {
  const t0 = ac.currentTime + 0.05;
  const beep = (at, freq, dur, vol, type = 'square') => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t0 + at);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + at + dur);
    o.connect(g).connect(ac.destination);
    o.start(t0 + at); o.stop(t0 + at + dur + 0.02);
  };
  for (let i = 0; i < 10; i++) beep(7 + i, i % 2 === 0 ? 1600 : 1200, 0.05, 0.25);
  beep(REVEAL_AT, 880, 0.6, 0.3, 'triangle');
  beep(REVEAL_AT + 0.12, 1320, 0.7, 0.25, 'triangle');
  return t0;
}

const playBtn = document.getElementById('play');
let ac = null;
playBtn.addEventListener('click', () => {
  playBtn.hidden = true;
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; }
  const start = performance.now();
  if (ac) { ac.resume(); scheduleSounds(ac); }
  const loop = now => {
    const t = (now - start) / 1000;
    render(t);
    if (t < DURATION) requestAnimationFrame(loop);
    else { playBtn.textContent = '↻ Rejouer'; playBtn.hidden = false; }
  };
  requestAnimationFrame(loop);
});

render(1.2); // aperçu avant lecture
</script>
</body>
</html>

const easeInOut = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const easeBack = x => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const prog = (t, start, dur, fn = easeOut) => fn((t - start) / dur);
const rand = n => { const x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); };
const vis = (t, a, b, f = 0.25) => clamp(Math.min((t - a) / f, (b - t) / f));

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function text(str, x, y, size, color, { align = 'center', alpha = 1, shadow = true } = {}) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.font = `bold ${size}px ${FONT}`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  if (shadow) { ctx.shadowColor = 'rgba(0,0,0,.85)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 4; }
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
  ctx.restore();
}

function pill(str, x, y, size, bg, fg, padX = 40) {
  ctx.save();
  ctx.font = `bold ${size}px ${FONT}`;
  const w = ctx.measureText(str).width + padX * 2, h = size * 1.7;
  ctx.fillStyle = bg; roundRect(x - w / 2, y - h / 2, w, h, h / 2); ctx.fill();
  ctx.restore();
  text(str, x, y + 2, size, fg, { shadow: false });
}

function bubble(str, x, y, size, alpha, tailX = 0) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.font = `bold ${size}px ${FONT}`;
  const w = ctx.measureText(str).width + 50, h = size * 1.8;
  ctx.globalAlpha = clamp(alpha);
  ctx.translate(x, y); ctx.scale(lerp(0.6, 1, clamp(alpha)), lerp(0.6, 1, clamp(alpha)));
  ctx.fillStyle = WHITE; roundRect(-w / 2, -h, w, h, 24); ctx.fill();
  ctx.beginPath(); ctx.moveTo(tailX - 16, -2); ctx.lineTo(tailX + 16, -2); ctx.lineTo(tailX, 28); ctx.fill();
  ctx.restore();
  ctx.save(); ctx.globalAlpha = clamp(alpha);
  text(str, x, y - h / 2, size, '#111', { shadow: false });
  ctx.restore();
}

// ---- Stickman ----
// pieds à y=0, tourné vers +x (face=-1 pour retourner)
// mood : 'smile' | 'sad' | 'shock' ; arms : 0 normal, 1 bras levés ; point : bras avant tendu
function drawStick(x, y, s, color, { run = 0, t = 0, kick = 0, face = 1, arms = 0, point = 0, gloves = false, mood = 'smile', rot = 0, label = '' } = {}) {
  const ph = t * 13;
  const bob = run ? Math.abs(Math.sin(ph)) * 8 : 0;
  const HIP = [0, -96], NECK = [0, -168], SH = [0, -158], L = 50;
  const seg = (p, a, len) => [p[0] + Math.sin(a) * len, p[1] + Math.cos(a) * len];
  const legs = [0, 1].map(side => {
    let thigh = run ? Math.sin(ph + side * Math.PI) * 0.75 : (side ? -0.14 : 0.14);
    let shin = thigh - (run ? Math.max(0, -Math.cos(ph + side * Math.PI)) * 1.3 : 0);
    if (side === 0 && kick > 0) { thigh = lerp(thigh, 1.25, kick); shin = lerp(shin, 1.0, kick); }
    const knee = seg(HIP, thigh, L);
    return [HIP, knee, seg(knee, shin, L)];
  });
  const hands = [];
  const armSegs = [0, 1].map(side => {
    let upper = run ? -Math.sin(ph + side * Math.PI) * 0.9 : (side ? -0.3 : 0.3);
    let fore = upper + (run ? 1.1 : 0.15);
    if (arms > 0) { upper = lerp(upper, side ? -2.5 : 2.5, arms); fore = lerp(fore, side ? -2.8 : 2.8, arms); }
    if (side === 0 && point > 0) { upper = lerp(upper, 1.6, point); fore = lerp(fore, 1.6, point); }
    const elbow = seg(SH, upper, 40), hand = seg(elbow, fore, 38);
    hands.push(hand);
    return [SH, elbow, hand];
  });
  const strokeAll = (w, c) => {
    ctx.strokeStyle = c; ctx.lineWidth = w;
    for (const [a, b, c2] of [...legs, ...armSegs]) { ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.lineTo(...c2); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(...HIP); ctx.lineTo(...NECK); ctx.stroke();
  };
  ctx.save();
  ctx.translate(x, y - bob * s);
  ctx.rotate(rot);
  ctx.scale(s * face, s);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  strokeAll(20, '#0b0b0b');
  strokeAll(11, color);
  if (gloves) for (const [hx, hy] of hands) {
    ctx.fillStyle = '#0b0b0b'; ctx.beginPath(); ctx.arc(hx, hy, 17, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = WHITE; ctx.beginPath(); ctx.arc(hx, hy, 12, 0, Math.PI * 2); ctx.fill();
  }
  const hx = 4, hy = -196;
  ctx.fillStyle = '#0b0b0b'; ctx.beginPath(); ctx.arc(hx, hy, 30, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(hx, hy, 25, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#0b0b0b'; ctx.strokeStyle = '#0b0b0b'; ctx.lineWidth = 4;
  const er = mood === 'shock' ? 6 : 4.5;
  for (const ex of [hx - 1, hx + 14]) { ctx.beginPath(); ctx.arc(ex, hy - 5, er, 0, Math.PI * 2); ctx.fill(); }
  ctx.beginPath();
  if (mood === 'smile') ctx.arc(hx + 6, hy + 2, 10, 0.35, 2.6);
  else if (mood === 'sad') ctx.arc(hx + 6, hy + 16, 9, 3.6, 5.8);
  else { ctx.ellipse(hx + 6, hy + 10, 5, 7, 0, 0, Math.PI * 2); }
  ctx.stroke();
  if (mood === 'sad') { // larme
    ctx.fillStyle = '#7fd1ff'; ctx.beginPath(); ctx.arc(hx + 16, hy + 6 + ((t * 40) % 14), 4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  if (label) { ctx.save(); ctx.translate(x, y - 265 * s); pill(label, 0, 0, 30, 'rgba(0,0,0,.65)', WHITE, 18); ctx.restore(); }
}

function drawBall(x, y, r = 16, rot = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = '#0b0b0b'; ctx.beginPath(); ctx.arc(0, 0, r + 3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = WHITE; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(0, 0, r * 0.35, 0, Math.PI * 2); ctx.fill();
  for (let i = 0; i < 5; i++) { const a = i * Math.PI * 2 / 5; ctx.beginPath(); ctx.arc(Math.cos(a) * r * 0.8, Math.sin(a) * r * 0.8, r * 0.2, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();
}

// ---- Décor ----
const P = { x: 70, y: 190, w: 940, h: 960 };
const GROUND = P.y + 780;
const G = GROUND + 40;          // ligne des pieds
const GOAL_X = P.x + 790;
let netBulge = 0;

function drawPitch({ night = false, crowdDim = 0, snow = false, t = 0 } = {}) {
  const { x, y, w, h } = P;
  const sky = ctx.createLinearGradient(0, y, 0, GROUND);
  sky.addColorStop(0, night ? '#0b1a3a' : '#5fb4ff'); sky.addColorStop(1, night ? '#2b4a7a' : '#bfe3ff');
  ctx.fillStyle = sky; ctx.fillRect(x, y, w, GROUND - y);
  ctx.fillStyle = night ? '#16233d' : '#7c8da3'; ctx.fillRect(x, GROUND - 170, w, 90);
  for (let i = 0; i < 80; i++) {
    ctx.fillStyle = ['#e63946', '#ffffff', '#3a86ff', '#ffd23f'][i % 4];
    ctx.globalAlpha = 0.55 * (1 - crowdDim); ctx.fillRect(x + rand(i) * w, GROUND - 160 + rand(i + 5) * 70, 8, 8); ctx.globalAlpha = 1;
  }
  for (let i = 0; i < 8; i++) {
    ctx.fillStyle = i % 2 ? '#2e9e4f' : '#35b25a';
    ctx.fillRect(x + i * w / 8, GROUND - 80, w / 8 + 1, y + h - GROUND + 80);
  }
  ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(x, GROUND + 30); ctx.lineTo(x + w, GROUND + 30); ctx.stroke();
  if (snow) {
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    for (let i = 0; i < 90; i++) {
      const sx = x + ((rand(i) * w + Math.sin(t * 2 + i) * 20 - t * 30) % w + w) % w;
      const sy = y + ((rand(i + 50) * h + t * (60 + rand(i + 7) * 60)) % h);
      ctx.beginPath(); ctx.arc(sx, sy, 3 + rand(i + 3) * 3, 0, Math.PI * 2); ctx.fill();
    }
  }
}

function drawGoal() {
  const gx = GOAL_X, top = GROUND - 240, d = 120;
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2;
  for (let i = 0; i <= 8; i++) { const b = netBulge * 30 * Math.sin(i / 8 * Math.PI); ctx.beginPath(); ctx.moveTo(gx + i * d / 8 + b, top); ctx.lineTo(gx + i * d / 8 + b, GROUND + 30); ctx.stroke(); }
  for (let j = 0; j <= 10; j++) { const yy = top + j * 27; ctx.beginPath(); ctx.moveTo(gx, yy); ctx.lineTo(gx + d + netBulge * 30 * Math.sin(j / 10 * Math.PI), yy); ctx.stroke(); }
  ctx.strokeStyle = '#0b0b0b'; ctx.lineWidth = 18;
  ctx.beginPath(); ctx.moveTo(gx, GROUND + 30); ctx.lineTo(gx, top); ctx.lineTo(gx + d, top); ctx.stroke();
  ctx.strokeStyle = WHITE; ctx.lineWidth = 11;
  ctx.beginPath(); ctx.moveTo(gx, GROUND + 30); ctx.lineTo(gx, top); ctx.lineTo(gx + d, top); ctx.stroke();
}

// taille de police réduite si le texte dépasse maxW
function fitSize(str, size, maxW) {
  ctx.font = `bold ${size}px ${FONT}`;
  return Math.min(size, Math.floor(size * maxW / ctx.measureText(str).width));
}

// gros titre sous le décor : ligne 1 puis ligne 2 (punchline)
function caption(t, a, b, l1, l2, t2, color2 = YELLOW) {
  const v = vis(t, a, b, 0.2); if (v <= 0) return;
  ctx.save(); ctx.globalAlpha = v;
  const p1 = prog(t, a, 0.3, easeBack);
  ctx.save(); ctx.translate(540, 1290); ctx.scale(p1, p1); text(l1, 0, 0, fitSize(l1, 62, 900), WHITE); ctx.restore();
  if (l2 && t >= t2) {
    const p2 = prog(t, t2, 0.3, easeBack);
    ctx.save(); ctx.translate(540, 1390); ctx.scale(p2, p2); text(l2, 0, 0, fitSize(l2, 72, 900), color2); ctx.restore();
  }
  ctx.restore();
}

// ---- Scènes ----
const HERO = TEAM;

// pièce intérieure (mur + sol + fenêtre)
function drawRoom({ wall = '#e9d8a6', floor = '#9c6644', dark = 0, windowSky = '#9fd3ff' } = {}) {
  const { x, y, w, h } = P;
  ctx.fillStyle = wall; ctx.fillRect(x, y, w, GROUND - y);
  ctx.fillStyle = floor; ctx.fillRect(x, GROUND - 40, w, y + h - GROUND + 40);
  ctx.fillStyle = '#0b0b0b'; ctx.fillRect(x + 90, y + 130, 230, 200);
  ctx.fillStyle = windowSky; ctx.fillRect(x + 100, y + 140, 210, 180);
  ctx.fillStyle = '#0b0b0b'; ctx.fillRect(x + 200, y + 140, 10, 180); ctx.fillRect(x + 100, y + 225, 210, 10);
  if (dark > 0) { ctx.fillStyle = `rgba(5,8,25,${dark})`; ctx.fillRect(x, y, w, h); }
}

function drawBed(bx, by) {
  ctx.fillStyle = '#0b0b0b'; roundRect(bx - 8, by - 68, 476, 96, 18); ctx.fill();
  ctx.fillStyle = '#5e60ce'; roundRect(bx, by - 60, 460, 80, 14); ctx.fill();
  ctx.fillStyle = WHITE; roundRect(bx + 10, by - 92, 110, 40, 16); ctx.fill();
  ctx.fillStyle = '#0b0b0b'; ctx.fillRect(bx, by + 20, 16, 50); ctx.fillRect(bx + 444, by + 20, 16, 50);
}

// le tir raté : ballon qui part au-dessus de la barre (k de 0 à 1)
function missedShot(gx, gy, scale, k) {
  const top = gy - 240 * scale, d = 120 * scale;
  ctx.strokeStyle = '#0b0b0b'; ctx.lineWidth = 14 * scale;
  ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx, top); ctx.lineTo(gx + d, top); ctx.stroke();
  ctx.strokeStyle = WHITE; ctx.lineWidth = 8 * scale;
  ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx, top); ctx.lineTo(gx + d, top); ctx.stroke();
  const bx = lerp(gx - 380 * scale, gx + 60 * scale, k), by = lerp(gy - 16 * scale, top - 260 * scale, k * k);
  drawBall(bx, by, 16 * scale, k * 12);
}

function sceneHook(t) {
  const v = vis(t, 0, 3.6); if (v <= 0) return;
  ctx.save(); ctx.globalAlpha = v;
  drawPitch({ night: true });
  netBulge = 0; drawGoal();
  const k = clamp((t % 1.6) / 1.1);
  const bx = lerp(420, GOAL_X + 40, k), by = lerp(G - 18, P.y + 150, k * k);
  drawBall(bx, by, 16, k * 12);
  drawStick(330, G, 1.4, HERO, { t, kick: t % 1.6 < 0.25 ? 1 : 0, mood: 'shock', label: 'TOI' });
  const p1 = prog(t, 0.1, 0.35, easeBack);
  ctx.save(); ctx.translate(540, P.y + 130); ctx.scale(p1, p1);
  text('LE LENDEMAIN', 0, 0, 96, YELLOW);
  ctx.restore();
  const p2 = prog(t, 0.6, 0.35, easeBack);
  ctx.save(); ctx.translate(540, P.y + 250); ctx.scale(p2, p2);
  pill('de ton penalty raté', 0, 0, 56, RED, WHITE, 36);
  ctx.restore();
  ctx.restore();
}

const NOTIFS = [[4.4, 'Mdr ton tir 😂'], [5.0, 'Le ballon est en orbite ?'], [5.6, 'Retrouvé sur Mars'], [6.2, 'Arrête le foot stp'], [6.8, 'Même mon chat tire mieux']];
function sceneWake(t) {
  const v = vis(t, 3.5, 8.6); if (v <= 0) return;
  ctx.save(); ctx.globalAlpha = v;
  drawRoom({});
  drawBed(P.x + 60, G - 30);
  // héros allongé dans le lit
  drawStick(P.x + 380, G - 96, 1.05, HERO, { t, rot: -Math.PI / 2, mood: t > 4.4 ? 'shock' : 'sad' });
  // réveil
  const ring = t > 3.7 && t < 4.6 ? Math.sin(t * 60) * 0.12 : 0;
  ctx.save(); ctx.translate(P.x + 760, P.y + 210); ctx.rotate(ring);
  ctx.fillStyle = '#0b0b0b'; roundRect(-110, -55, 220, 110, 22); ctx.fill();
  text('7:00', 0, 4, 66, RED, { shadow: false });

  // téléphone qui vibre + notifications
  const buzz = NOTIFS.some(([at]) => t > at && t < at + 0.25) ? Math.sin(t * 90) * 5 : 0;
  ctx.save(); ctx.translate(P.x + 720 + buzz, P.y + 330);
  ctx.fillStyle = '#0b0b0b'; roundRect(-150, 0, 300, 470, 36); ctx.fill();
  ctx.fillStyle = '#1d2433'; roundRect(-134, 18, 268, 434, 26); ctx.fill();

  NOTIFS.forEach(([at, msg], i) => {

    const ny = P.y + 380 + i * 80;

  ctx.restore();

function sceneNight(t) {
  const v = vis(t, 23.4, 28.6); if (v <= 0) return;
  ctx.save(); ctx.globalAlpha = v;
  drawRoom({ windowSky: '#0b1a3a' });
  ctx.fillStyle = '#f4f1de'; ctx.beginPath(); ctx.arc(P.x + 250, P.y + 190, 22, 0, Math.PI * 2); ctx.fill();
  drawBed(P.x + 60, G - 30);
  drawStick(P.x + 380, G - 96, 1.05, HERO, { t, rot: -Math.PI / 2, mood: 'shock' });
  ctx.fillStyle = 'rgba(5,8,25,.55)'; ctx.fillRect(P.x, P.y, P.w, P.h);
  // bulle de pensée avec le tir en boucle
  const p = prog(t, 23.8, 0.4, easeBack);
  if (p > 0) {
    ctx.save(); ctx.translate(P.x + 640, P.y + 330); ctx.scale(p, p);
    for (const [dx, dy, r] of [[-250, 250, 16], [-210, 200, 24]]) { ctx.fillStyle = WHITE; ctx.beginPath(); ctx.arc(dx, dy, r, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = WHITE; ctx.beginPath(); ctx.ellipse(0, 0, 260, 190, 0, 0, Math.PI * 2); ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.ellipse(0, 0, 245, 175, 0, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = '#35b25a'; ctx.fillRect(-260, 70, 520, 120);
    const k = clamp(((t - 23.8) % 1.3) / 1.0);
    missedShot(80, 80, 0.55, k);
    ctx.restore();
    ctx.restore();
    const replays = 1 + Math.floor(Math.max(0, t - 23.8) / 1.3) * 12;
    ctx.save(); ctx.translate(P.x + 640, P.y + 590); pill(`REPLAY x${replays}`, 0, 0, 40, '#0b0b0b', YELLOW, 24); ctx.restore();
  }
  ctx.restore();
  caption(t, 23.5, 28.6, 'Le soir, impossible de dormir…', 'tu revois ton tir en boucle.', 25.6, '#7fd1ff');
}

function sceneOutro(t) {
  const v = vis(t, 28.4, 99); if (v <= 0) return;
  ctx.save(); ctx.globalAlpha = v;
  drawPitch({ night: true });
  netBulge = 0; drawGoal();
  drawStick(450, G, 1.6, HERO, { t, arms: prog(t, 28.8, 0.4), mood: 'smile', label: 'TOI' });
  const p = prog(t, 28.7, 0.35, easeBack);
  ctx.save(); ctx.translate(540, P.y + 150); ctx.scale(p, p);
  text('ON A TOUS', 0, 0, 90, WHITE); text('UN POTE COMME ÇA', 0, 100, 66, YELLOW);
  ctx.restore();
  ctx.restore();
  caption(t, 28.5, 99, 'Identifie le pote', 'qui a raté son penalty', 29.6);
}

function drawProgress(t) {
  ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(0, 0, W, 10);
  ctx.fillStyle = YELLOW; ctx.fillRect(0, 0, W * clamp(t / DURATION), 10);
}

function render(t) {
  t = clamp(t, 0, DURATION);
  ctx.fillStyle = '#04110a'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  roundRect(P.x, P.y, P.w, P.h, 30); ctx.clip();
  ctx.fillStyle = '#071a10'; ctx.fillRect(P.x, P.y, P.w, P.h);
  ctx.restore();
  // scènes : décor clipé dans le cadre, titres dessous
  const scenes = [sceneHook, sceneWake, sceneBreakfast, sceneStreet, sceneTraining, sceneNight, sceneOutro];
  for (const scene of scenes) {
    ctx.save(); roundRect(P.x, P.y, P.w, H - P.y, 30); ctx.clip(); scene(t); ctx.restore();
  }
  ctx.strokeStyle = 'rgba(255,255,255,.2)'; ctx.lineWidth = 4;
  roundRect(P.x, P.y, P.w, P.h, 30); ctx.stroke();
  drawProgress(t);
}
window.renderAt = render;

const playBtn = document.getElementById('play');
const sfx = document.getElementById('sfx');
playBtn.addEventListener('click', () => {
  playBtn.hidden = true;
  sfx.currentTime = 0;
  const start = performance.now();
  sfx.play().catch(() => {});
  const loop = now => {
    const t = !sfx.paused && sfx.currentTime > 0 ? sfx.currentTime : (now - start) / 1000;
    render(t);
    if (t < DURATION) requestAnimationFrame(loop);
    else { playBtn.textContent = '↻ Rejouer'; playBtn.hidden = false; }
  };
  requestAnimationFrame(loop);
});

render(1.6);
</script>
</body>
